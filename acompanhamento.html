  if(e.foraDaRevisao) h+='<div class="aviso-linha aviso-verm" style="border-radius:0">⚠️ Esta esquadria não está no PDF mais novo. Ela não foi apagada: confira com o comercial.</div>';
  h+='<div class="ficha-corpo"><div>'+
    '<div class="desenho" id="desenho-'+e.id+'">'+(e.desenho?'carregando desenho...':'sem desenho no PDF')+'</div>'+
    '<div class="proj"><b>Projeto:</b> '+esc(p.dimTxt||((p.dimL||'?')+' x '+(p.dimH||'?')))+(p.qtde?' · Qtde '+esc(p.qtde):'')+'<br>'+
      (p.cor?'<b>Cor:</b> '+esc(p.cor)+'<br>':'')+(p.vidro?'<b>Vidro:</b> '+esc(p.vidro)+'<br>':'')+
      (p.descricao?'<b>Descrição:</b> '+esc(p.descricao):'')+'</div>'+
    (e.notas||[]).map(function(n){
      return '<div class="nota-pdf'+(n.conjunto?' conjunto':'')+'">'+(n.conjunto?'<b>CONJUNTO '+esc(n.conjunto.join(' + '))+':</b> ':'<b>Anotação no PDF:</b> ')+esc(n.texto)+'</div>';
    }).join('')+
  '</div><div>';
  h+='<div class="grade2">'+campoTxt(e,'tipo','Tipo','Ex.: P1')+campoTxt(e,'local','Localização','Ex.: Corredor')+'</div>';
  h+='<div class="secao"><h4>Largura (mm)</h4><div class="grade">'+campoNum(e,'lCima','Em cima')+campoNum(e,'lMeio','No meio')+campoNum(e,'lBaixo','Embaixo')+'</div></div>';
  h+='<div class="secao"><h4>Altura (mm)</h4><div class="grade">'+campoNum(e,'hEsq','Esquerda')+campoNum(e,'hCentro','Centro')+campoNum(e,'hDir','Direita')+'</div></div>';
  h+='<div class="secao"><h4>Diagonais (mm)</h4><div class="grade2">'+campoNum(e,'d1','Diagonal 1')+campoNum(e,'d2','Diagonal 2')+'</div></div>';
  h+='<div class="resultado'+(c.L===null||c.H===null?' incompleto':'')+'" id="vao-'+e.id+'">'+htmlVao(c)+'</div>';
  h+='<div class="secao"><h4>Condição do vão</h4><div class="grade2"><div class="fg"><select data-e="'+e.id+'" data-c="condicao" onchange="digitou(this)"'+(ehConsulta()?' disabled':'')+'>'+
    '<option value=""'+(cond?'':' selected')+'>— escolha —</option>'+
    '<option value="liberado"'+(cond==='liberado'?' selected':'')+'>Liberado</option>'+
    '<option value="nao"'+(cond==='nao'?' selected':'')+'>Não liberado</option></select></div></div>';
  if(cond==='nao'){
    h+='<div class="faltas">'+FALTAS.map(function(f){
      return '<label><input type="checkbox" data-e="'+e.id+'" data-falta="'+f.id+'"'+(faltas.indexOf(f.id)>=0?' checked':'')+(ehConsulta()?' disabled':'')+' onchange="marcouFalta(this)"> '+esc(f.nome)+'</label>';
    }).join('')+'</div>';
    if(faltas.indexOf('outro')>=0) h+='<div style="margin-top:6px">'+campoTxt(e,'faltaOutro','O que mais falta','Descreva')+'</div>';
  }
  h+='</div>';
  h+='<div class="secao"><h4>Observações</h4><div class="fg"><textarea data-e="'+e.id+'" data-c="obs" oninput="digitou(this)"'+(ehConsulta()?' disabled':'')+'>'+esc(valor(e,'obs'))+'</textarea></div></div>';
  h+=htmlMidias(e);
  h+='<div class="secao"><h4>Setor técnico</h4><div class="grade2">'+campoNum(e,'folgaL','Folga L')+campoNum(e,'folgaH','Folga H')+'</div>'+
    '<div class="resultado'+(c.pL===null||c.pH===null?' incompleto':'')+'" id="prod-'+e.id+'">'+htmlProducao(c)+'</div>'+
    (e.visto?'<div style="font-size:12px;color:var(--green);margin-top:6px">✔ Liberado para produção por <b>'+esc(e.visto.quem)+'</b> em '+esc(fmtQuando(e.visto.quando))+'</div>':'')+'</div>';
  h+='<div class="secao"><h4>Etapa</h4><div class="fg"><select data-e="'+e.id+'" data-c="etapa" onchange="mudouEtapa(this)"'+(ehConsulta()?' disabled':'')+'>'+
    ETAPAS.map(function(x){ return '<option value="'+x.id+'"'+(x.id===etapa?' selected':'')+'>'+esc(x.nome)+'</option>'; }).join('')+'</select></div>'+
    '<div style="font-size:11.5px;color:var(--gray-4);margin-top:4px">Só vai ao técnico com o vão liberado e as medidas feitas; só vai à produção com a folga preenchida.</div></div>';
  if(soAdmin() && (e.historico||[]).length){
    h+='<div class="hist"><b>Histórico</b><br>'+e.historico.slice().reverse().slice(0,40).map(function(x){
      return esc(fmtQuando(x.quando))+' · '+esc(x.quem)+' · '+esc(CAMPOS_FICHA[x.campo]||x.campo)+': '+esc(x.de===''?'(vazio)':x.de)+' → '+esc(x.para===''?'(vazio)':x.para);
    }).join('<br>')+'</div>';
  }
  h+='</div></div></div>';
  return h;
}
function htmlVao(c){
  if(c.L===null&&c.H===null) return 'Medida do vão: digite as larguras e as alturas — vale a <b>menor</b> de cada sentido.';
  return 'Medida do vão (a menor): <b>'+(c.L===null?'?':c.L)+' x '+(c.H===null?'?':c.H)+' mm</b>';
}
function htmlProducao(c){
  if(c.pL===null||c.pH===null) return 'Medida de produção = vão − folga (preencha a folga).';
  return 'Medida de produção: <b>'+c.pL+' x '+c.pH+' mm</b>';
}
async function mostrarDesenho(a,e){
  if(!e.desenho) return;
  const el=document.getElementById('desenho-'+e.id);
  if(desenhoSuspeito(e.desenho)){ if(el) el.textContent='corrigindo o desenho...'; return; }
  const o=obraPorId(a.ctoId);
  const doc=(docsDeMedicao(o)).find(function(d){ return d.id===e.desenho.doc; }) ||
            (a.origem&&a.origem.doc===e.desenho.doc?{id:a.origem.doc,url:a.origem.url,nome:a.origem.nome}:null);
  if(!doc){ if(el) el.textContent='o PDF não está mais anexado na Obra'; return; }
  try{
    const src=await desenhoDe(doc,e.desenho);
    const alvo=document.getElementById('desenho-'+e.id);
    if(alvo) alvo.innerHTML='<img alt="Desenho '+esc(e.tipoPdf)+'" src="'+src+'">';
  }catch(err){
    const alvo=document.getElementById('desenho-'+e.id);
    if(alvo) alvo.textContent='não consegui mostrar o desenho ('+(err&&err.message||err)+')';
  }
}
async function verPdfOriginal(){
  const a=acompDaObra(obraAberta);
  if(!a||!a.origem) return;
  try{ const u=await linkDoAnexo(a.origem.url,a.origem.nome); window.open(u,'_blank'); }
  catch(e){ aviso('Não consegui abrir o PDF', e.message); }
}
function relerMedicao(){
  if(temRascunho()){ aviso('Salve antes','Há medidas não salvas. Salve (ou descarte) antes de ler o PDF de novo.'); return; }
  const o=obraPorId(obraAberta);
  if(o) montarFichas(o,true);
}

// ================= DIGITAR E SALVAR =================
function esquadriaNaTela(id){
  const a=acompDaObra(obraAberta);
  return a?a.esquadrias.find(function(e){ return e.id===id; }):null;
}
function anotar(id,campo,v){
  const e=esquadriaNaTela(id); if(!e) return;
  const base=baseFichas[id]||e;
  if(!rascunho[id]) rascunho[id]={};
  const orig=base[campo]==null?'':String(base[campo]);
  if(String(v)===orig) delete rascunho[id][campo]; else rascunho[id][campo]=v;
  if(!Object.keys(rascunho[id]).length) delete rascunho[id];
}
function digitou(el){
  const id=el.getAttribute('data-e'), campo=el.getAttribute('data-c');
  anotar(id,campo,el.value);
  el.classList.toggle('mudou', !!(rascunho[id]&&Object.prototype.hasOwnProperty.call(rascunho[id],campo)));
  const e=esquadriaNaTela(id);
  if(e){
    const c=contasDe(e);
    const v=document.getElementById('vao-'+id); if(v){ v.innerHTML=htmlVao(c); v.classList.toggle('incompleto',c.L===null||c.H===null); }
    const p=document.getElementById('prod-'+id); if(p){ p.innerHTML=htmlProducao(c); p.classList.toggle('incompleto',c.pL===null||c.pH===null); }
    const f=document.getElementById('ficha-'+id); if(f) f.classList.toggle('suja',!!rascunho[id]);
  }
  // A condicao muda o que aparece (o que falta): redesenha so esta ficha.
  if(campo==='condicao') redesenharFicha(id);
  atualizarBarraSalvar();
}
function marcouFalta(el){
  const id=el.getAttribute('data-e');
  const e=esquadriaNaTela(id); if(!e) return;
  const atual=String(valor(e,'faltas')||'').split(',').filter(Boolean);
  const f=el.getAttribute('data-falta');
  const nova=el.checked?(atual.indexOf(f)<0?atual.concat([f]):atual):atual.filter(function(x){ return x!==f; });
  const ordenada=FALTAS.map(function(x){ return x.id; }).filter(function(x){ return nova.indexOf(x)>=0; });
  anotar(id,'faltas',ordenada.join(','));
  redesenharFicha(id);
  atualizarBarraSalvar();
}
function mudouEtapa(el){
  const id=el.getAttribute('data-e');
  const e=esquadriaNaTela(id); if(!e) return;
  const nova=el.value, c=contasDe(e);
  if((nova==='tecnico'||nova==='producao') && valor(e,'condicao')!=='liberado'){
    el.value=valor(e,'etapa')||'medir';
    aviso('Ainda não','Só vai ao técnico com o vão marcado como "Liberado".'); return;
  }
  if((nova==='tecnico'||nova==='producao') && (c.L===null||c.H===null)){
    el.value=valor(e,'etapa')||'medir';
    aviso('Ainda não','Faltam as medidas do vão (pelo menos uma largura e uma altura).'); return;
  }
  if(nova==='producao' && (c.fL===null||c.fH===null)){
    el.value=valor(e,'etapa')||'medir';
    aviso('Ainda não','Só vai à produção com a folga L e a folga H preenchidas.'); return;
  }
  anotar(id,'etapa',nova);
  redesenharFicha(id);
  atualizarBarraSalvar();
}
function redesenharFicha(id){
  const a=acompDaObra(obraAberta); if(!a) return;
  const e=a.esquadrias.find(function(x){ return x.id===id; }); if(!e) return;
  const el=document.getElementById('ficha-'+id); if(!el) return;
  const foco=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-c');
  const desenho=document.getElementById('desenho-'+id);
  const img=desenho?desenho.innerHTML:'';
  const t=document.createElement('div'); t.innerHTML=htmlFicha(a,e);
  el.replaceWith(t.firstChild);
  const d2=document.getElementById('desenho-'+id); if(d2&&img) d2.innerHTML=img;
  preencherMiniaturas(document.getElementById('ficha-'+id));
  if(foco){ const f=document.querySelector('#ficha-'+id+' [data-c="'+foco+'"]'); if(f) f.focus(); }
}
function temRascunho(){ return Object.keys(rascunho).length>0; }
function atualizarBarraSalvar(){
  const b=document.getElementById('barra-salvar');
  const n=Object.keys(rascunho).length;
  b.classList.toggle('visivel', n>0 && !!obraAberta);
  document.getElementById('barra-salvar-txt').textContent=n===1?'1 esquadria com alteração não salva':n+' esquadrias com alteração não salva';
}
function descartarRascunho(){
  if(!confirm('Descartar o que foi digitado e não salvo?')) return;
  rascunho={}; baseFichas={};
  render();
}

// Escolha quando eu e um colega mudamos o MESMO campo da mesma esquadria.
function pedirEscolha(c){
  return new Promise(function(ok){
    const ov=document.getElementById('escolha-ov');
    const fmt=function(v){ return v===''||v==null?'(vazio)':String(v); };
    document.getElementById('escolha-corpo').innerHTML=
      '<div style="font-size:13.5px;line-height:1.6"><b>'+esc(c.esq)+' · '+esc(CAMPOS_FICHA[c.campo]||c.campo)+'</b><br>'+
      'Outra pessoa salvou um valor diferente enquanto você digitava. Qual fica?</div>'+
      '<div class="escolha" id="esc-meu"><b>O meu:</b> '+esc(fmt(c.meu))+'</div>'+
      '<div class="escolha" id="esc-deles"><b>O que está salvo'+(c.quem?' ('+esc(c.quem)+')':'')+':</b> '+esc(fmt(c.deles))+'</div>';
    ov.classList.add('open');
    document.getElementById('esc-meu').onclick=function(){ ov.classList.remove('open'); ok('meu'); };
    document.getElementById('esc-deles').onclick=function(){ ov.classList.remove('open'); ok('deles'); };
  });
}

// Salva a obra aberta. Junta campo a campo, por esquadria (mesma regra da
// Fabrica): campo que so eu mudei vai; campo que so o colega mudou fica o
// dele; os dois mudaram o mesmo campo -> pergunta. Nada de substituir a
// esquadria inteira.
async function salvarObra(){
  if(!temRascunho()) return;
  const btn=document.getElementById('btn-salvar'); btn.disabled=true;
  const meu=copia(rascunho), base=copia(baseFichas);
  let mudancas=0;
  const deu=await alterar(async function(srv){
    mudancas=0;
    const a=srv.acompanhamentos.find(function(x){ return x.ctoId===obraAberta; });
    if(!a) return false;
    const escolhas={};
    for(const id of Object.keys(meu)){
      const e=a.esquadrias.find(function(x){ return x.id===id; });
      if(!e) continue;   // esquadria sumiu do banco: nao recria por conta propria
      if(!Array.isArray(e.historico)) e.historico=[];
      for(const campo of Object.keys(meu[id])){
        const ref=base[id]&&base[id][campo]!=null?String(base[id][campo]):'';
        const mine=String(meu[id][campo]);
        const deles=e[campo]==null?'':String(e[campo]);
        let fica;
        if(deles===ref||deles===mine) fica=mine;
        else {
          const k=id+'|'+campo;
          if(!escolhas[k]){
            const ult=e.historico.slice().reverse().find(function(x){ return x.campo===campo; });
            escolhas[k]=await pedirEscolha({esq:e.tipo||e.tipoPdf,campo:campo,meu:mine,deles:deles,quem:ult?ult.quem:''});
          }
          fica=escolhas[k]==='meu'?mine:deles;
        }
        if(fica===deles) continue;
        e.historico.push({quando:agoraISO(),quem:usuario,campo:campo,de:deles,para:fica});
        if(e.historico.length>200) e.historico=e.historico.slice(-200);
        e[campo]=fica;
        mudancas++;
      }
      // Regras da etapa conferidas de novo com o que ficou gravado.
      const L=menor([e.lCima,e.lMeio,e.lBaixo]), H=menor([e.hEsq,e.hCentro,e.hDir]);
      if((e.etapa==='tecnico'||e.etapa==='producao') && (e.condicao!=='liberado'||L===null||H===null)) e.etapa='campo';
      if(e.etapa==='producao' && (mm(e.folgaL)===null||mm(e.folgaH)===null)) e.etapa='tecnico';
      if(e.etapa==='producao' && !e.visto) e.visto={quem:usuario,quando:agoraISO()};
      if(e.etapa!=='producao' && e.visto) e.visto=null;
      if((!e.etapa||e.etapa==='medir') && L!==null && H!==null) e.etapa='campo';
    }
    if(!mudancas) return false;
  }, function(){
    const o=obraPorId(obraAberta)||{};
    return {acao:'salvou medidas',alvo:(o.ct?o.ct+' · ':'')+(o.cliente||''),detalhe:mudancas+' campo(s)'};
  });
  btn.disabled=false;
  if(deu){ rascunho={}; baseFichas={}; render(); }
  else if(!mudancas){
    // O banco ja tinha exatamente o que estava na tela (ou o colega salvou o
    // mesmo valor): nada a gravar, nada a perder.
    rascunho={}; baseFichas={}; render(); status('🟢 Já estava salvo · '+agoraHora());
  }
}

window.addEventListener('beforeunload',function(ev){
  if(temRascunho() || _visitaNovas.length || _gravador){ ev.preventDefault(); ev.returnValue=''; }
});

// ================= ABERTURA =================
function abrirApp(nome,papelDoUsuario){
  usuario=nome;
  papel=String(papelDoUsuario||'').toLowerCase();
  acaoSessao('sessao-entrar',{sistema:'acompanhamento'}).catch(function(){});
  if(!_checkSessao) _checkSessao=setInterval(checkForceLogout,5000);
  document.getElementById('bloqueio').style.display='none';
  document.getElementById('app').style.display='block';
  lerLocal();
  try{ const a=sessionStorage.getItem('dalum-acomp-aberta'); if(a) obraAberta=a; }catch(e){}
  render();
  sincronizar();
  document.getElementById('aviso-ov').addEventListener('click',function(e){ if(e.target===this) fecharAviso(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && document.getElementById('aviso-ov').classList.contains('open')) fecharAviso();
  });
  // Busca alteracoes de colegas a cada 60 s. Com medida digitada e nao salva,
  // os dados chegam mas a tela nao e redesenhada por baixo de quem digita: a
  // juncao acontece no Salvar.
  setInterval(function(){ atualizarDoBanco(); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) atualizarDoBanco(); });
}
async function atualizarDoBanco(){
  if(_gravando) return;
  if(temRascunho()){
    try{
      const versao=_versaoLocal;
      const d=await buscarRemoto();
      if(d && !_gravando && versao===_versaoLocal){ dados=d; gravarLocal(); status('🟡 Há alteração não salva · '+agoraHora()); }
    }catch(e){}
    return;
  }
  const foco=document.activeElement;
  if(foco && /INPUT|TEXTAREA|SELECT/.test(foco.tagName) && foco.id!=='busca') return;
  sincronizar();
}

(function iniciar(){
  const t=lerToken();
  if(t){ abrirApp(t.dados.n||t.dados.u||'usuário', t.dados.r); return; }
  const sso=lerSSO();
  if(sso){ abrirApp(sso.nome, sso.role); return; }
  // Sem cracha: vai para o portal, o unico lugar onde se entra.
  try{ (window.top||window).location.replace(PORTAL_URL); }
  catch(e){ window.location.replace(PORTAL_URL); }
})();
</script>
