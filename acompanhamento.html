<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento · Daluminium</title>
<style>
:root{--cor:#C2255C;--cor-dark:#A61E4D;--cor-light:#FCE8EF;--red:#C0392B;--red-light:#FDF0EE;--amber:#B9770E;--amber-light:#FEF7E6;--green:#1A7A45;--green-light:#EDFAF3;--gray-1:#F7F8F9;--gray-2:#EEF0F2;--gray-3:#DEE1E5;--gray-4:#9AA1AB;--gray-5:#5A6370;--gray-6:#23282F;--radius:8px;--shadow:0 1px 4px rgba(0,0,0,0.07),0 0 0 0.5px rgba(0,0,0,0.05)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-1);color:var(--gray-6);font-size:14px;min-height:100vh}
.topbar{background:var(--cor-dark);color:#fff;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(0,0,0,.15);gap:8px}
.topbar-logo{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;min-width:0}
.topbar-logo span{opacity:.75;font-weight:400;font-size:13px}
.topbar-actions{display:flex;align-items:center;gap:8px}
#sync{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid transparent;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
.btn-outline{background:#fff;color:var(--gray-6);border-color:var(--gray-3)}.btn-outline:hover{background:var(--gray-1)}
.btn-cor{background:var(--cor);color:#fff;border-color:var(--cor-dark)}.btn-cor:hover{background:var(--cor-dark)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.main{max-width:1100px;margin:0 auto;padding:1rem 1rem 6rem}
.busca{width:100%;padding:9px 12px;border:1px solid var(--gray-3);border-radius:var(--radius);font-family:inherit;font-size:14px;background:#fff;margin-bottom:12px}
.lista-obras{display:flex;flex-direction:column;gap:8px}
.obra-linha{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;border-left:4px solid var(--gray-3)}
.obra-linha:hover{background:var(--cor-light)}
.obra-linha.tem-med{border-left-color:var(--cor)}
.obra-ct{font-weight:700;font-size:13px;color:var(--cor-dark);min-width:48px}
.obra-nome{font-weight:600;flex:1;min-width:0}
.obra-sub{font-size:12px;color:var(--gray-5);margin-top:2px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--gray-2);color:var(--gray-5);white-space:nowrap}
.pill-cor{background:var(--cor-light);color:var(--cor-dark)}
.pill-verde{background:var(--green-light);color:var(--green)}
.pill-ambar{background:var(--amber-light);color:var(--amber)}
.pill-verm{background:var(--red-light);color:var(--red)}
.vazio{text-align:center;color:var(--gray-4);padding:30px 10px;font-style:italic}
.cab{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.cab-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cab-titulo{font-size:18px;font-weight:700;flex:1;min-width:0}
.cab-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 16px}
.cab-item label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-4)}
.cab-item div{font-size:13.5px;margin-top:1px;word-break:break-word}
.cab-item .falta{color:var(--gray-4);font-style:italic}
.avisos{margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.aviso-linha{border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.5}
.aviso-ambar{background:var(--amber-light);color:#7a4e07;border:1px solid #F5D98A}
.aviso-azul{background:var(--cor-light);color:var(--cor-dark);border:1px solid #F3C4D4}
.aviso-verm{background:var(--red-light);color:var(--red);border:1px solid #F3C7C1}
.ficha{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;border:2px solid transparent}
.ficha.suja{border-color:var(--amber)}
.ficha-topo{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--cor-light);flex-wrap:wrap}
.ficha-topo .tipo{font-size:17px;font-weight:800;color:var(--cor-dark)}
.ficha-corpo{padding:12px 14px;display:grid;grid-template-columns:200px 1fr;gap:14px}
.desenho{background:var(--gray-1);border:1px solid var(--gray-2);border-radius:8px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gray-4);text-align:center;padding:4px}
.desenho img{max-width:100%;height:auto;display:block}
.proj{font-size:12.5px;line-height:1.55;color:var(--gray-5);margin-top:8px}
.proj b{color:var(--gray-6)}
.secao{margin-top:12px}
.secao h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-5);margin-bottom:6px}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fg label{display:block;font-size:11.5px;color:var(--gray-5);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 9px;border:1px solid var(--gray-3);border-radius:7px;font-family:inherit;font-size:14px;background:#fff}
.fg textarea{min-height:64px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--cor)}
.fg input.mudou,.fg select.mudou,.fg textarea.mudou{background:#FFFBEA;border-color:var(--amber)}
.resultado{background:var(--green-light);border-radius:8px;padding:8px 12px;font-size:13.5px;color:#14532d;margin-top:8px}
.resultado.incompleto{background:var(--gray-2);color:var(--gray-5)}
.faltas{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px}
.faltas label{display:flex;align-items:center;gap:5px;cursor:pointer}
.nota-pdf{background:#FFF8E1;border-left:3px solid var(--amber);padding:6px 10px;border-radius:4px;font-size:12.5px;margin-top:6px}
.nota-pdf.conjunto{background:#FDECEA;border-left-color:var(--red)}
.depois{font-size:12px;color:var(--gray-4);font-style:italic}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.foto{position:relative;background:var(--gray-1);border:1px solid var(--gray-2);border-radius:8px;overflow:hidden}
.foto img{display:block;width:100%;height:110px;object-fit:cover;cursor:zoom-in;background:var(--gray-2)}
.foto-leg{font-size:10.5px;color:var(--gray-5);padding:4px 6px;line-height:1.35}
.foto-leg a{color:var(--cor-dark)}
.foto-x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:26px;cursor:pointer}
.midia-botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.midia-botoes label.btn{cursor:pointer}
.audio-linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.audio-info{font-size:12px;color:var(--gray-5)}
.pdf-botoes{display:flex;gap:8px;flex-wrap:wrap}
#visita-pe .pdf-botoes{width:100%;margin-bottom:4px}
.foto-rel{display:block;width:100%;border:0;border-top:1px solid var(--gray-2);background:#fff;color:var(--gray-5);font-size:11px;padding:5px;cursor:pointer;font-family:inherit;text-align:center}
.foto-rel.on{background:#FFF4D6;color:#7a4e07;font-weight:700}
.visita-linha{border-top:1px solid var(--gray-2);padding:9px 2px;cursor:pointer;font-size:13.5px}
.visita-linha:hover{background:var(--cor-light)}
.vv-linha{display:grid;grid-template-columns:110px 150px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.vv-tipo{font-size:13px}.vv-tipo span{font-size:11.5px;color:var(--gray-5)}
.grade-visita{grid-template-columns:1fr 1fr 1.4fr}
@media (max-width:560px){ .vv-linha{grid-template-columns:1fr 1fr} .vv-linha .fg:last-child{grid-column:1 / -1}
  .grade-visita{grid-template-columns:1fr 1fr} .grade-visita .fg:last-child{grid-column:1 / -1} }
.btn.gravando{animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.6}}
.hist{font-size:12px;color:var(--gray-5);max-height:160px;overflow:auto;border-top:1px dashed var(--gray-3);margin-top:10px;padding-top:6px}
.barra-salvar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--amber);padding:10px 16px;display:none;align-items:center;justify-content:center;gap:12px;z-index:60;box-shadow:0 -2px 10px rgba(0,0,0,.1);flex-wrap:wrap}
.barra-salvar.visivel{display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:.6rem}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(480px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--gray-2)}
.modal-title{font-size:15px;font-weight:700}
.modal-body{padding:14px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--gray-2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.escolha{border:1px solid var(--gray-3);border-radius:8px;padding:10px;margin-top:8px;cursor:pointer}
.escolha:hover{border-color:var(--cor);background:var(--cor-light)}
.bloqueio{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:24px;text-align:center;color:var(--gray-5)}
@media (max-width:700px){
  .ficha-corpo{grid-template-columns:1fr}
  .desenho{max-width:260px;margin:0 auto;width:100%}
  .topbar-logo span{display:none}
  .grade{gap:6px}
}
@media (max-width:480px){
  .topbar{padding:0 .6rem}
  .topbar-logo{font-size:15px;white-space:nowrap}
  .topbar-actions{gap:5px}
  #sync{font-size:10.5px;max-width:84px;white-space:normal;line-height:1.2;text-align:right}
}
</style>
<script>
// ---- MODO ESPELHO ("Ver como", pedido do Ander, 16/10/2026) ----
// Mesmo bloco dos outros modulos: na aba em que o admin ve o sistema como
// outra pessoa, nada le, grava nem apaga o armazenamento que as abas dividem.
try{ if(sessionStorage.getItem('dalum-espelho')){ (function(){
  const L=window.localStorage, P=Storage.prototype, ler=P.getItem, gravar=P.setItem, tirar=P.removeItem, limpar=P.clear;
  P.getItem=function(k){ return this===L?null:ler.call(this,k); };
  P.setItem=function(k,v){ if(this!==L) return gravar.call(this,k,v); };
  P.removeItem=function(k){ if(this!==L) return tirar.call(this,k); };
  P.clear=function(){ if(this!==L) return limpar.call(this); };
})(); } }catch(e){}

// Marca que este modulo esta aberto DENTRO do portal, para o CSS esconder a
// faixa duplicada.
try{ if(window.self!==window.top) document.documentElement.classList.add('dentro-do-portal'); }
catch(e){ document.documentElement.classList.add('dentro-do-portal'); }
</script>
</head>
<body>
<!-- ================================================================
     AVISO DE AMBIENTE DE TESTE
     Este bloco existe SOMENTE nos arquivos de teste. Ao levar um

     do identificador do sistema.
     Motivo: em 11/08/2026 contas reais foram lancadas aqui achando que
     era producao, porque as duas telas eram identicas.
     ================================================================ -->
<div id="faixa-teste">Ambiente de teste &middot; o que voce lancar aqui nao vale</div>

<div class="bloqueio" id="bloqueio">Abrindo...</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">&#128208; Acompanhamento <span>medição de vãos</span></div>
    <div class="topbar-actions">
      <span id="sync"></span>
      <button class="btn btn-ghost btn-sm" id="btn-voltar" style="display:none" onclick="voltarParaLista()">&larr; Obras</button>
      <button class="btn btn-ghost btn-sm" id="btn-sair" onclick="sairDoModulo()">Sair</button>
    </div>
  </div>
  <div class="main" id="tela"></div>
</div>

<div class="barra-salvar" id="barra-salvar">
  <span id="barra-salvar-txt" style="font-size:13.5px;font-weight:600;color:#7a4e07">Há medidas não salvas</span>
  <button class="btn btn-outline" onclick="descartarRascunho()">Descartar</button>
  <button class="btn btn-cor" id="btn-salvar" onclick="salvarObra()">&#128190; Salvar</button>
</div>

<div class="overlay" id="aviso-ov" style="z-index:400">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="aviso-titulo">Aviso</div></div>

    <div class="modal-foot"><button class="btn btn-cor" id="aviso-btn" onclick="fecharAviso()">Entendi</button></div>
  </div>
</div>

<div class="overlay" id="visita-ov" style="z-index:300">
  <div class="modal" style="width:min(680px,100%)">
    <div class="modal-head"><div class="modal-title" id="visita-titulo">Registrar visita</div></div>
    <div class="modal-body" id="visita-corpo"></div>
    <div class="modal-foot" id="visita-pe"></div>
  </div>
</div>

<div class="overlay" id="escolha-ov" style="z-index:410">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="escolha-titulo">Duas pessoas mudaram o mesmo campo</div></div>
    <div class="modal-body" id="escolha-corpo"></div>

</div>

<script>
// ================= CONFIG =================
const WORKER='https://daluminium-api.daluminium2.workers.dev';
// Identificador do sistema no banco: SEM acento (vai num cabecalho HTTP).
// Producao: 'acompanhamento'.
const SUPA_SISTEMA='acompanhamento_teste';
// ATENCAO: muda de teste para producao, igual ao SUPA_SISTEMA acima.
// Producao: https://daluminium.github.io/portal/
const PORTAL_URL='https://daluminium.github.io/teste/';
// Deriva do SUPA_SISTEMA, como na Fabrica e na Obra: menos diferenca para
// manter entre os dois ambientes.
const AMBIENTE = /_teste$/.test(SUPA_SISTEMA) ? 'teste' : 'producao';
const LS_KEY='dalum-acomp';
const LS_OBRAS='dalum-acomp-obras';
const TOKEN_KEY='dalum-token';
// Copia local de TODOS os modulos (mesmo endereco, mesmo armazenamento): sair
// de qualquer um limpa todos. Lista igual a dos outros, mais as deste modulo.
const DADOS_LOCAIS=['dalum-data','fin-data','dalum-fabrica','dalum-obra','dalum-crm','dalum-crm-para-obra',
  'portal-admin-passes','dalum-admin-passes','fin-admin-passes',LS_KEY,LS_OBRAS];

// Etapas de cada esquadria. O id NUNCA muda (fica gravado na ficha).
const ETAPAS=[
  {id:'medir',    nome:'A medir'},
  {id:'campo',    nome:'Medido em campo'},
  {id:'tecnico',  nome:'No técnico'},
  {id:'producao', nome:'Liberado para produção'}
];
const FALTAS=[
  {id:'reboco', nome:'Reboco'},
  {id:'contrapiso', nome:'Contrapiso'},
  {id:'revestimento', nome:'Revestimento'},
  {id:'prumo', nome:'Prumo / esquadro'},
  {id:'outro', nome:'Outro'}
];
// Os campos que a pessoa digita em cada esquadria. E por esta lista que a
// gravacao junta campo a campo o que eu mudei e o que um colega mudou.
const CAMPOS_FICHA={
  tipo:'Tipo', local:'Localização',
  lCima:'Largura em cima', lMeio:'Largura no meio', lBaixo:'Largura embaixo',
  hEsq:'Altura à esquerda', hCentro:'Altura no centro', hDir:'Altura à direita',
  d1:'Diagonal 1', d2:'Diagonal 2',
  condicao:'Condição do vão', faltas:'O que falta', faltaOutro:'Outro (o que falta)',
  obs:'Observações', folgaL:'Folga L', folgaH:'Folga H', etapa:'Etapa'
};

let dados={acompanhamentos:[],historico:[]};
let obras=[];             // recorte da Obra que o Worker entrega
let usuario='', papel='';
let obraAberta=null;      // id do contrato (da Obra) aberto na tela
// Rascunho: o que foi digitado e ainda nao foi salvo, por esquadria e campo.
// Base: como cada esquadria estava quando a tela foi montada — e a referencia
// para saber o que EU mudei e o que um colega mudou (mesma ideia da Fabrica).
let rascunho={}, baseFichas={};
let _gravando=0, _versaoLocal=0;

// ================= UTILIDADES =================
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function novoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function agoraISO(){ return new Date().toISOString(); }
function agoraHora(){ return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtData(d){ if(!d) return ''; const p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; }
// Data LOCAL (AAAA-MM-DD) de um carimbo gravado em hora internacional. Cortar
// o texto do carimbo dava o dia seguinte depois das 20h em Porto Velho.
function diaLocal(iso){
  const d=new Date(iso); if(isNaN(d)) return String(iso||'').slice(0,10);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtQuando(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function semAcento(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function copia(o){ return JSON.parse(JSON.stringify(o)); }
function status(txt,cor){ const e=document.getElementById('sync'); if(e){ e.textContent=txt; e.style.color=cor||'rgba(255,255,255,.85)'; } }
// Numero em milimetros: aceita "2.900", "2900", "2900,5". Vazio ou zero = sem medida.
function mm(v){ const n=parseFloat(String(v==null?'':v).replace(/\./g,'').replace(',','.')); return isFinite(n)&&n>0?n:null; }

// ================= AVISOS NA TELA =================
let _avisoAoFechar=null;
function aviso(titulo, texto, aoFechar){
  document.getElementById('aviso-titulo').textContent=titulo||'Aviso';
  document.getElementById('aviso-texto').textContent=texto||'';
  _avisoAoFechar=aoFechar||null;
  document.getElementById('aviso-ov').classList.add('open');
  setTimeout(function(){ const b=document.getElementById('aviso-btn'); if(b) b.focus(); },60);
}
function fecharAviso(){
  document.getElementById('aviso-ov').classList.remove('open');
  const fn=_avisoAoFechar; _avisoAoFechar=null;
  if(fn) fn();
}

// ================= CRACHA E SESSAO (igual aos outros modulos) =================
function loginGuardaLer(chave){
  try{ const v=sessionStorage.getItem(chave); if(v!==null) return v; }catch(e){}
  try{ return localStorage.getItem(chave); }catch(e){ return null; }
}
function loginGuardaApagar(chave){
  let meu=null;
  try{ meu=sessionStorage.getItem(chave); }catch(e){}
  try{ sessionStorage.removeItem(chave); }catch(e){}
  try{ if(meu===null || localStorage.getItem(chave)===meu) localStorage.removeItem(chave); }catch(e){}
}
function lerSSO(){
  try{
    const s=JSON.parse(loginGuardaLer('dalum-sso')||'null');
    if(!s||!s.nome) return null;
    if(Date.now()-s.ts>8*60*60*1000){ loginGuardaApagar('dalum-sso'); return null; }
    return s;
  }catch(e){ return null; }
}
function b64urlParaTexto(s){
  const b64=s.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(b64+'==='.slice((b64.length+3)%4));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function lerToken(){
  try{
    const t=loginGuardaLer(TOKEN_KEY);
    if(!t) return null;
    const partes=t.split('.');
    if(partes.length!==2) return null;
    const d=JSON.parse(b64urlParaTexto(partes[0]));
    if(!d||!d.exp||Date.now()>=d.exp){ loginGuardaApagar(TOKEN_KEY); return null; }
    return {token:t,dados:d};
  }catch(e){ loginGuardaApagar(TOKEN_KEY); return null; }
}

}

// Ler sempre sem cache: no-store e um parametro que muda a cada chamada.
async function buscarRemoto(){
  const r=await fetch(WORKER+'?t='+Date.now()+'-'+Math.random().toString(36).slice(2,7),{cache:'no-store',headers:cabecalhos()});
  if(r.status===503){ telaBloqueio('Sistema em manutenção','Estamos ajustando o sistema. Seus dados estão guardados.'); throw new Error('manutencao'); }
  if(r.status===403){ telaBloqueio('Sem acesso a este módulo','Seu acesso não inclui o Acompanhamento' + (AMBIENTE==='teste'?' (ou este é o ambiente de teste, que é só para administradores e gerentes)':'') + '. Peça ao administrador para liberar.'); throw new Error('Acesso negado'); }
  if(r.status===401){ sessaoExpirada(); throw new Error('Sessao expirada'); }
  if(!r.ok) throw new Error('Worker '+r.status);
  const j=await r.json();
  if(!j||typeof j!=='object'||Array.isArray(j)) return null;
  if(!Array.isArray(j.acompanhamentos)) j.acompanhamentos=[];
  if(!Array.isArray(j.historico)) j.historico=[];
  return j;
}

// GRAVACAO CONDICIONAL (20/10/2026): manda a versao que leu (X-Base). Se outra
// pessoa gravou no meio, o Worker responde 409 e nada e gravado por cima.
async function enviarRemoto(payload, versaoLida){
  const extra={'Content-Type':'application/json'};
  if(versaoLida) extra['X-Base']=versaoLida;
  const r=await fetch(WORKER,{method:'PATCH',headers:cabecalhos(extra),body:JSON.stringify({data:payload})});
  if(r.status===401){ sessaoExpirada(); throw new Error('Sessao expirada'); }
  if(r.status===409) return 'conflito';
  if(!r.ok) throw new Error('Worker '+r.status);
  return 'ok';
}

// Toda alteracao passa por aqui: rele o banco, aplica a mudanca em cima do que
// esta la e grava com X-Base. Confere depois pelo carimbo, porque o Worker ja
// respondeu "ok" sem gravar (registro inexistente).
async function alterar(fn, registro){
  if(recusarSeConsulta()) return false;
  _versaoLocal++; _gravando++;
  try{ return await gravarAlteracao(fn, registro); }
  finally{ _gravando--; }
}
async function gravarAlteracao(fn, registro){
  status('🔄 Salvando...');
  try{
    let base=null, carimbo='';
    for(let tentativa=0; tentativa<4; tentativa++){
      base=null;
      try{ base=await buscarRemoto(); }catch(e){ base=null; }
      // Sem conseguir ler o banco NAO grava: gravar a copia local por cima
      // poderia apagar o que um colega salvou.
      if(!base) throw new Error('sem leitura');
      const versaoLida=String(base.atualizadoEm||'');
      const ok=await fn(base);
      if(ok===false){ status('🟡 Nada salvo'); return false; }
      if(registro){
        try{ const r=(typeof registro==='function')?registro(base):registro; if(r&&r.acao) logGeral(base,r.acao,r.alvo,r.detalhe); }catch(e){}
      }
      carimbo=agoraISO();
      base.atualizadoEm=carimbo; base.atualizadoPor=usuario;
      const deu=await enviarRemoto(base, versaoLida);
      if(deu!=='conflito') break;
      status('🔀 Outra pessoa salvou junto — juntando...');
      if(tentativa===3) throw new Error('conflito');
      await new Promise(function(ok){ setTimeout(ok,300+Math.random()*700); });
    }
    let confere=null;
    try{ confere=await buscarRemoto(); }catch(e){ confere=null; }
    const depoisDeMim=!!confere && confere.atualizadoEm!==carimbo &&
      new Date(confere.atualizadoEm).getTime()>new Date(carimbo).getTime();
    if(!confere || (confere.atualizadoEm!==carimbo && !depoisDeMim)){
      status('🔴 NÃO gravou no servidor','#ffcccc');
      aviso('As medidas NÃO foram salvas','O servidor respondeu que deu certo, mas ao conferir, a informação não estava lá.\n\n'+
        'Não continue: avise o responsável pelo sistema. O que você digitou continua na tela.');
      return false;
    }
    dados=confere; gravarLocal();
    status('🟢 Salvo · '+agoraHora());
    return true;
  }catch(e){
    status('🔴 Não salvou','#ffcccc');
    aviso('Não foi possível salvar','Verifique a internet e tente de novo.\n\nNada foi perdido: o que você digitou continua na tela.');
    return false;
  }
}

const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_SELO='sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
const PDFJS_AJUDANTE_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDFJS_AJUDANTE_SELO='sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2';
let _pdfjs=null;
function carregarPdfJs(){
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise(function(ok,falhou){
    const s=document.createElement('script');
    s.src=PDFJS_URL; s.integrity=PDFJS_SELO; s.crossOrigin='anonymous';
    s.onload=async function(){
      try{
        const lib=window.pdfjsLib;
        if(!lib) throw new Error('o leitor de PDF não carregou direito');
        const r=await fetch(PDFJS_AJUDANTE_URL,{integrity:PDFJS_AJUDANTE_SELO,mode:'cors'});
        if(!r.ok) throw new Error('não consegui baixar o leitor de PDF');
        lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));
        ok(lib);
      }catch(e){ _pdfjs=null; falhou(e); }
    };
    s.onerror=function(){ _pdfjs=null; falhou(new Error('não consegui baixar o leitor de PDF (confira a internet)')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}

  return j.abrir||j.url;

// Um PDF aberto fica guardado na memoria desta tela: os desenhos de todas as
// esquadrias saem dele sem baixar de novo.
const _pdfs={};
function abrirPdf(doc){
  if(_pdfs[doc.url]) return _pdfs[doc.url];
  _pdfs[doc.url]=(async function(){
    const lib=await carregarPdfJs();
    const u=await linkDoAnexo(doc.url,doc.nome);

  })();

  return _pdfs[doc.url];
}

// Le um PDF do SmartCEM (Alumisoft) e devolve a(s) proposta(s) e as esquadrias.
// Cada esquadria e um bloco marcado pelo rotulo "Tipo:". Ha DOIS modelos de
// impressao (achados em 22/10/2026):
//  A) "Tipo: | Localizacao: | Dimensoes | Qtde" no TOPO do bloco; descricao,
//     cor e vidro embaixo (proposta da Caroline).
//  B) descricao, "Acabamento:" e "Vidros:" em cima e a linha
//     "Tipo: | Qtd: | L: | H: | Linha: | Localizacao:" no FIM do bloco
//     (proposta do Pedro Marcelino / Sidney).
// O modelo e reconhecido bloco a bloco pelos rotulos da linha do "Tipo:".
// As anotacoes feitas por cima do PDF vem em letra MAIOR que a do SmartCEM
// (9 pt): no modelo A em 18, no B em 12. Ficam como observacao do bloco onde
// caem; texto grande fora de qualquer bloco (cabecalho, rodape) e ignorado.
async function lerSmartCem(doc){
  const pdf=await abrirPdf(doc);
  const lib=await carregarPdfJs();
  const itens=[], imagens=[], alturaPag={};
  for(let n=1;n<=pdf.numPages;n++){
    const pg=await pdf.getPage(n);
    const vp=pg.getViewport({scale:1});
    alturaPag[n]=vp.height;
    const tc=await pg.getTextContent();
    tc.items.forEach(function(it){
      const t=String(it.str||'').trim();
      if(!t) return;
      itens.push({p:n,x:it.transform[4],y:vp.height-it.transform[5],h:it.height||Math.abs(it.transform[3])||0,w:it.width||0,t:t});
    });
    const ops=await pg.getOperatorList();
    let m=[1,0,0,1,0,0]; const pilha=[];
    const mul=function(a,b){ return [a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]]; };
    for(let i=0;i<ops.fnArray.length;i++){
      const f=ops.fnArray[i];
      if(f===lib.OPS.save) pilha.push(m.slice());
      else if(f===lib.OPS.restore) m=pilha.pop()||m;
      else if(f===lib.OPS.transform) m=mul(m,ops.argsArray[i]);
      else if(f===lib.OPS.paintImageXObject||f===lib.OPS.paintInlineImageXObject||f===lib.OPS.paintJpegXObject){
        const w=Math.abs(m[0]), h=Math.abs(m[3]);
        imagens.push({p:n,x:Math.min(m[4],m[4]+m[0]),y:vp.height-Math.max(m[5],m[5]+m[3]),w:w,h:h});
      }
    }
  }
  const igual=function(a,b){ return Math.abs(a-b)<=4; };
  const LETRA_ANOTACAO=10.5;   // o SmartCEM escreve em 9 pt (rodape 7-8)
  // Propostas citadas no PDF (um PDF pode juntar varias: V3, V3A, V3B...).
  const propostas=[];
  itens.forEach(function(i){
    (i.t.toUpperCase().match(/ORC-[\w-]*\w/g)||[]).forEach(function(pr){ if(propostas.indexOf(pr)<0) propostas.push(pr); });
  });
  const prop=propostas[0]||'';
  // Nome do cliente no cabecalho ("Cliente:" e o valor na mesma linha). Serve
  // para avisar quando o PDF anexado e de outro cliente.
  let clientePdf='';
  const rotCli=itens.find(function(i){ return /^cliente:?$/i.test(i.t); });
  if(rotCli){
    clientePdf=itens.filter(function(i){ return i.p===rotCli.p && Math.abs(i.y-rotCli.y)<=4 && i.x>rotCli.x && i.x<rotCli.x+300 && i.h<LETRA_ANOTACAO && !/:$/.test(i.t); })
      .sort(function(a,b){ return a.x-b.x; }).map(function(i){ return i.t; }).join(' ').trim();
  }
  const rotulos=itens.filter(function(i){ return /^tipo:?$/i.test(i.t); })
    .sort(function(a,b){ return a.p-b.p || a.y-b.y; });
  // Onde comeca o conteudo de cada pagina: depois do cabecalho da proposta.
  const CABECALHO=/^(prazo de execu|validade|emitido por|obra:|proposta|cliente:|contato:|end\. obra|cidade:|cep:|cpf:|telefone:|e-mail:)/i;
  const inicioPagina={};
  rotulos.forEach(function(r){
    if(inicioPagina[r.p]!==undefined) return;
    const cab=itens.filter(function(i){ return i.p===r.p && i.y<r.y-40 && CABECALHO.test(i.t); });
    inicioPagina[r.p]=cab.length?Math.max.apply(null,cab.map(function(i){ return i.y; }))+8:0;
  });
  const fimPagina=function(p){
    const rod=itens.filter(function(i){ return i.p===p && /smartcem|alumisoft/i.test(i.t); }).map(function(i){ return i.y; });
    return (rod.length?Math.min.apply(null,rod):alturaPag[p]||842)-20;
  };
  const blocos=rotulos.map(function(r,k){
    const linha=itens.filter(function(i){ return i.p===r.p && igual(i.y,r.y) && i.x>r.x; });
    const modeloB=linha.some(function(i){ return /^(l|h|qtd):?$/i.test(i.t); });
    const ant=rotulos[k-1], prox=rotulos[k+1];
    if(modeloB){
      return {r:r,p:r.p,modelo:'B',linha:linha,
        y0:(ant&&ant.p===r.p)?ant.y+22:inicioPagina[r.p],
        y1:r.y+22};
    }
    return {r:r,p:r.p,modelo:'A',linha:linha,
      y0:r.y-12, y1:(prox&&prox.p===r.p)?prox.y-12:fimPagina(r.p)};
  });
  const noBloco=function(b){ return itens.filter(function(i){ return i.p===b.p && i.y>=b.y0 && i.y<b.y1; }); };
  // Junta pedacos da mesma linha; sem espaco quando um encosta no outro
  // ("J0" + "4" = "J04").
  const juntar=function(lista){
    let s='', fim=null;
    lista.forEach(function(i){
      if(s && !(fim!==null && i.x-fim<1.2)) s+=' ';
      s+=i.t; fim=i.w?i.x+i.w:null;
    });
    return s;
  };
  const usados=new Set();
  const esquadrias=blocos.map(function(b){
    const its=noBloco(b);
    const aoLado=function(re){
      const r=its.find(function(i){ return re.test(i.t); });
      if(!r) return {txt:'',r:null};
      usados.add(r);
      const v=its.filter(function(i){ return igual(i.y,r.y) && i.x>r.x && i.h<LETRA_ANOTACAO; }).sort(function(a,c){ return a.x-c.x; });
      v.forEach(function(i){ usados.add(i); });
      return {txt:juntar(v),r:r};
    };
    let tipo='', local='', qtde='', dimL='', dimH='', dimTxt='', cor='', vidro='', descricao='', linhaProd='';
    const linhaValores=its.filter(function(i){ return i.y>b.r.y+6 && i.y<b.r.y+30 && i.h<LETRA_ANOTACAO; });
    const naColuna=function(de,ate){ return linhaValores.filter(function(i){ return i.x>=de && i.x<ate; }).sort(function(a,c){ return a.x-c.x; }); };
    linhaValores.forEach(function(i){ usados.add(i); });
    b.linha.forEach(function(i){ usados.add(i); }); usados.add(b.r);
    if(b.modelo==='B'){
      const col=function(re,padrao){ const i=b.linha.find(function(x){ return re.test(x.t); }); return i?i.x:padrao; };
      const xQtd=col(/^qtd/i,b.r.x+60), xL=col(/^l:?$/i,xQtd+57), xH=col(/^h:?$/i,xL+48), xLin=col(/^linha/i,xH+62), xLoc=col(/^localiza/i,xLin+90);
      tipo=juntar(naColuna(b.r.x-15,xQtd-6));
      qtde=juntar(naColuna(xQtd-8,xL-8));
      dimL=juntar(naColuna(xL-10,xH-8)).replace(/\D/g,'');
      dimH=juntar(naColuna(xH-10,xLin-10)).replace(/\D/g,'');
      linhaProd=juntar(naColuna(xLin-10,xLoc-20));
      local=juntar(naColuna(xLoc-20,99999));
      dimTxt=dimL&&dimH?dimL+' x '+dimH:'';
      const ac=aoLado(/^acabamento/i);
      cor=ac.txt;
      const vi=aoLado(/^vidros?:?$/i);
      vidro=vi.txt;
      if(!vidro){ const sv=its.find(function(i){ return /^sem vidros?$/i.test(i.t); }); if(sv){ vidro='Sem vidros'; usados.add(sv); } }
      // Descricao: o texto de cima, antes do "Acabamento:" (pode ter varias linhas).
      const limite=ac.r?ac.r.y-2:b.r.y-2;
      const desc=its.filter(function(i){
        return i.y<limite && i.x>=b.r.x-10 && i.h<LETRA_ANOTACAO && !usados.has(i) && !/:$/.test(i.t);
      }).sort(function(a,c){ return a.y-c.y || a.x-c.x; });
      const porLinha=[]; desc.forEach(function(i){ const l=porLinha.find(function(x){ return igual(x.y,i.y); }); if(l) l.its.push(i); else porLinha.push({y:i.y,its:[i]}); });
      descricao=porLinha.map(function(l){ return juntar(l.its); }).join(' ');
      desc.forEach(function(i){ usados.add(i); });
    } else {
      const cab=function(re){ return b.linha.find(function(i){ return re.test(i.t); }); };
      const cLoc=cab(/^localiza/i), cDim=cab(/^dimens/i), cQtd=cab(/^qtde?/i);
      const xLoc=cLoc?cLoc.x:b.r.x+90, xDim=cDim?cDim.x:xLoc+110, xQtd=cQtd?cQtd.x:xDim+100;
      tipo=juntar(naColuna(b.r.x-15,xLoc-10));
      local=juntar(naColuna(xLoc-15,xDim-10));
      dimTxt=juntar(naColuna(xDim-15,xQtd-10));
      qtde=juntar(naColuna(xQtd-15,99999));
      const dm=dimTxt.match(/(\d+)\s*[xX×]\s*(\d+)/);
      dimL=dm?dm[1]:''; dimH=dm?dm[2]:'';
      cor=aoLado(/^cor da esquadria/i).txt;
      vidro=aoLado(/^vidros?:?$/i).txt;
      const d=aoLado(/^descri/i);
      descricao=d.txt;
      if(d.r){
        const resto=its.filter(function(i){ return i.y>d.r.y+4 && i.y<d.r.y+50 && i.h<LETRA_ANOTACAO && i.x>=d.r.x-6 && !usados.has(i) && !/:$/.test(i.t); })
          .sort(function(a,c){ return a.y-c.y || a.x-c.x; });
        resto.forEach(function(i){ usados.add(i); descricao+=' '+i.t; });
      }
    }
    // Todo o resto em letra normal do bloco e do SmartCEM (areas, rotulos...).
    its.forEach(function(i){ if(i.h<LETRA_ANOTACAO) usados.add(i); });
    // Desenho: imagem cujo MEIO esta na coluna da esquerda (antes do "Tipo:")
    // e dentro do bloco; a mais perto do meio do bloco. Recortada a coluna e
    // ao bloco — ha desenho que "vaza" para os lados no PDF. O rodape do PDF
    // (faixa larga a partir da margem) tem o meio fora da coluna.
    const meioBloco=(b.y0+b.y1)/2;
    const cand=imagens.filter(function(im){
      const mx=im.x+im.w/2, my=im.y+im.h/2;
      return im.p===b.p && im.w>=40 && im.h>=40 && mx<b.r.x && my>=b.y0 && my<b.y1;
    }).sort(function(a,c){ return Math.abs(a.y+a.h/2-meioBloco)-Math.abs(c.y+c.h/2-meioBloco); })[0]||null;
    let desenho=null;
    if(cand){
      const x0=Math.max(0,cand.x), x1=Math.min(cand.x+cand.w,b.r.x-3);
      const y0=Math.max(cand.y,b.y0-4), y1=Math.min(cand.y+cand.h,b.y1);
      if(x1-x0>=30 && y1-y0>=30) desenho={p:cand.p,x:x0,y:y0,w:x1-x0,h:y1-y0};
    }
    return {
      tipo:tipo, local:local, qtde:qtde, linha:linhaProd,
      dimL:dimL, dimH:dimH, dimTxt:dimTxt,
      cor:cor, vidro:vidro, descricao:descricao.replace(/\s+/g,' ').trim(),
      desenho:desenho, notas:[]
    };
  });
  // Anotacoes: texto em letra maior que nao e de nenhum campo e cai DENTRO de
  // um bloco. Pedacos vizinhos viram uma nota so.
  const blocoDe=function(i){ return blocos.findIndex(function(b){ return b.p===i.p && i.y>=b.y0 && i.y<b.y1; }); };
  const soltos=itens.filter(function(i){ return !usados.has(i) && i.h>=LETRA_ANOTACAO && blocoDe(i)>=0; })
    .sort(function(a,b){ return a.p-b.p || a.y-b.y || a.x-b.x; });
  const notas=[];
  soltos.forEach(function(i){
    const k=blocoDe(i);
    const ult=notas[notas.length-1];
    if(ult && ult.k===k && i.y-ult.yFim<=26 && Math.abs(i.x-ult.x)<=60){ ult.t+=' · '+i.t; ult.yFim=i.y; return; }
    notas.push({k:k,p:i.p,x:i.x,y:i.y,yFim:i.y,t:i.t});
  });
  notas.forEach(function(n){
    // Nota que cita duas ou mais esquadrias (ex.: P2+P3) e de CONJUNTO: vai
    // para todas as citadas, marcada.
    // Compara sem o "_" (no PDF aparece "P05_A+P05B"), e so palavra inteira
    // (P1 nao conta dentro de P10).
    const sem=function(s){ return String(s||'').toUpperCase().replace(/_/g,''); };
    const textoNota=sem(n.t);
    const unicos=[];
    esquadrias.forEach(function(e){
      const t=sem(e.tipo); if(!t||unicos.indexOf(e.tipo.toUpperCase())>=0) return;
      const re=new RegExp('(^|[^A-Z0-9])'+t.replace(/[^A-Z0-9]/g,'\\$&')+'(?![A-Z0-9])');
      if(re.test(textoNota)) unicos.push(e.tipo.toUpperCase());
    });
    if(unicos.length>=2){
      esquadrias.forEach(function(e){
        if(unicos.indexOf(e.tipo.toUpperCase())>=0) e.notas.push({texto:n.t,conjunto:unicos});
      });
    } else {
      esquadrias[n.k].notas.push({texto:n.t});
    }
  });
  return {proposta:prop, propostas:propostas, revisao:revisaoDe(prop), cliente:clientePdf, esquadrias:esquadrias};
}

// Recorta o desenho de uma esquadria da pagina do PDF. Guarda na memoria da
// tela: o banco guarda so a posicao, nao a imagem (a imagem pesaria em toda
// gravacao de todas as obras).
const _desenhos={};
async function desenhoDe(doc, d){
  const chave=doc.url+'|'+d.p+'|'+Math.round(d.x)+'|'+Math.round(d.y);
  if(_desenhos[chave]) return _desenhos[chave];
  _desenhos[chave]=(async function(){
    const pdf=await abrirPdf(doc);
    const pg=await pdf.getPage(d.p);
    const escala=3;
    const vp=pg.getViewport({scale:escala});
    const c=document.createElement('canvas');
    c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const m=3;
    const sx=Math.max(0,(d.x-m)*escala), sy=Math.max(0,(d.y-m)*escala);
    const sw=Math.min(c.width-sx,(d.w+2*m)*escala), sh=Math.min(c.height-sy,(d.h+2*m)*escala);
    const r=document.createElement('canvas');
    r.width=Math.floor(sw); r.height=Math.floor(sh);
    r.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,sw,sh);
    return r.toDataURL('image/png');
  })();
  _desenhos[chave].catch(function(){ delete _desenhos[chave]; });
  return _desenhos[chave];
}

const PASTA_ARQUIVOS='daluminium_acompanhamento';
// Envio assinado pelo Worker: o arquivo sobe como privado (igual a Obra).
async function enviarArquivoPrivado(arquivo,tipoRecurso,nome){
  const r=await fetch(WORKER,{method:'POST',cache:'no-store',
    headers:cabecalhos({'Content-Type':'application/json','X-Action':'assinar-envio'}),
    body:JSON.stringify({pasta:PASTA_ARQUIVOS})});
  let a=null; try{ a=await r.json(); }catch(e){}
  if(r.status===401){ sessaoExpirada(); throw new Error('sessão expirada'); }
  if(!r.ok||!a||!a.signature) throw new Error((a&&a.erro)||('o servidor não autorizou o envio ('+r.status+')'));
  const fd=new FormData();
  fd.append('file',arquivo,nome||'arquivo');
  fd.append('api_key',a.api_key); fd.append('timestamp',a.timestamp);
  fd.append('signature',a.signature); fd.append('folder',a.folder); fd.append('type',a.type);
  const up=await fetch('https://api.cloudinary.com/v1_1/'+a.conta+'/'+tipoRecurso+'/upload',{method:'POST',body:fd});
  if(!up.ok){ let t=''; try{ t=await up.text(); }catch(e){} throw new Error('o servidor de arquivos recusou ('+up.status+') '+t.slice(0,120)); }
  const j=await up.json();
  // O endereco devolvido traz uma assinatura que abriria o arquivo para
  // sempre, sem login. Guardado sem ela; quem abre e o Worker.
  ['secure_url','url'].forEach(function(k){ if(j&&typeof j[k]==='string') j[k]=j[k].replace(/\/s--[^\/]+--\//,'/'); });
  return j;
}
// Depois de gravar SEM o arquivo, pede para apagar no Cloudinary. O Worker so
// apaga se nenhum registro citar mais o arquivo. Falha aqui nao atrapalha.
async function excluirArquivoDoAnexo(url){
  if(!url) return;
  try{ await fetch(WORKER,{method:'POST',cache:'no-store',
    headers:cabecalhos({'Content-Type':'application/json','X-Action':'excluir-anexo'}),
    body:JSON.stringify({url:url})}); }catch(e){}
}
// Reduz a foto no celular antes de subir: ~1600 px no lado maior, JPEG 70%.
// Uma foto de celular de 4 MB vira uns 300 KB — sobe rapido na obra.
function reduzirFoto(arquivo){
  return new Promise(function(ok,falhou){
    const u=URL.createObjectURL(arquivo);
    const im=new Image();
    im.onload=function(){
      const maior=Math.max(im.naturalWidth,im.naturalHeight)||1;
      const f=Math.min(1,1600/maior);
      const c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*f); c.height=Math.round(im.naturalHeight*f);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function(b){ b?ok(b):falhou(new Error('não consegui reduzir a foto')); },'image/jpeg',0.7);
    };
    im.onerror=function(){ URL.revokeObjectURL(u); falhou(new Error('o arquivo não é uma foto que o navegador consiga abrir')); };
    im.src=u;
  });
}
// Onde a pessoa esta na hora da foto. Sem permissao ou sem sinal, segue sem
// local (nunca impede a foto).
function pegarLocal(){
  return new Promise(function(ok){
    if(!navigator.geolocation) return ok(null);
    let feito=false;
    const fim=function(v){ if(!feito){ feito=true; ok(v); } };
    setTimeout(function(){ fim(null); },10000);
    navigator.geolocation.getCurrentPosition(function(p){
      fim({lat:Math.round(p.coords.latitude*1e6)/1e6, lng:Math.round(p.coords.longitude*1e6)/1e6, prec:Math.round(p.coords.accuracy||0)});
    },function(){ fim(null); },{enableHighAccuracy:true,timeout:9000,maximumAge:60000});
  });
}
function linkMapa(l){ return 'https://www.google.com/maps?q='+encodeURIComponent(l.lat+','+l.lng); }
// Miniaturas: baixadas uma vez por tela e guardadas na memoria.
const _miniaturas={};
function miniatura(url,nome){
  if(_miniaturas[url]) return _miniaturas[url];
  _miniaturas[url]=(async function(){
    const u=await linkDoAnexo(url,nome,'miniatura');
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error('foto '+r.status);
    return URL.createObjectURL(await r.blob());
  })();
  _miniaturas[url].catch(function(){ delete _miniaturas[url]; });
  return _miniaturas[url];
}
async function preencherMiniaturas(raiz){

// Grava foto/audio direto no banco (nao passa pelo rascunho das medidas):
// le o banco, acrescenta na lista daquela esquadria e grava. Duas pessoas
// pondo foto juntas nao apagam uma a outra (gravacao condicional).
async function acrescentarNaEsquadria(esqId, lista, item, rotulo){
  const o=obraPorId(obraAberta)||{};
  return alterar(function(base){
    const a=base.acompanhamentos.find(function(x){ return x.ctoId===obraAberta; });
    const e=a&&a.esquadrias.find(function(x){ return x.id===esqId; });
    if(!e) return false;
    if(!Array.isArray(e[lista])) e[lista]=[];
    e[lista].push(item);
    if(!Array.isArray(e.historico)) e.historico=[];
    e.historico.push({quando:agoraISO(),quem:usuario,campo:lista,de:'',para:'+ '+item.nome});
  },{acao:'acrescentou '+rotulo, alvo:(o.ct?o.ct+' · ':'')+(o.cliente||''), detalhe:item.nome});
}
async function tirarDaEsquadria(esqId, lista, itemId, rotulo){
  const a0=acompDaObra(obraAberta);
  const e0=a0&&a0.esquadrias.find(function(x){ return x.id===esqId; });
  const it=e0&&(e0[lista]||[]).find(function(x){ return x.id===itemId; });
  if(!it) return;
  if(!podeTirar(it)){ aviso('Não dá para tirar','Só quem pôs o arquivo, o gerente ou o administrador pode tirar.'); return; }
  if(!confirm('Tirar '+rotulo+' "'+it.nome+'"?')) return;
  const o=obraPorId(obraAberta)||{};
  const deu=await alterar(function(base){
    const a=base.acompanhamentos.find(function(x){ return x.ctoId===obraAberta; });
    const e=a&&a.esquadrias.find(function(x){ return x.id===esqId; });
    if(!e||!Array.isArray(e[lista])) return false;
    const antes=e[lista].length;
    e[lista]=e[lista].filter(function(x){ return x.id!==itemId; });
    if(e[lista].length===antes) return false;
    if(!Array.isArray(e.historico)) e.historico=[];
    e.historico.push({quando:agoraISO(),quem:usuario,campo:lista,de:it.nome,para:'(tirado)'});
  },{acao:'tirou '+rotulo, alvo:(o.ct?o.ct+' · ':'')+(o.cliente||''), detalhe:it.nome});
  if(deu){ excluirArquivoDoAnexo(it.url); redesenharFicha(esqId); }
}

async function recebeuFotos(input){
  const esqId=input.getAttribute('data-e'), daGaleria=input.getAttribute('data-galeria')==='1';
  const arquivos=Array.prototype.slice.call(input.files||[]);
  input.value='';
  if(!arquivos.length || recusarSeConsulta()) return;
  const e=esquadriaNaTela(esqId); if(!e) return;
  // Local so na foto da camera: a da galeria pode ter sido tirada em outro lugar.
  const local=daGaleria?null:await pegarLocal();
  let feitas=0;
  for(let i=0;i<arquivos.length;i++){
    const f=arquivos[i];
    status('📷 Enviando foto '+(i+1)+' de '+arquivos.length+'...');
    try{
      const reduzida=await reduzirFoto(f);
      const tipo=e.tipo||e.tipoPdf||'vao';
      const nome=tipo+'_'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'_'+(i+1)+'.jpg';
      const j=await enviarArquivoPrivado(reduzida,'image',nome);
      const quando=daGaleria&&f.lastModified?new Date(f.lastModified).toISOString():agoraISO();
      const item={id:novoId(),url:j.secure_url,nome:nome,tamanho:reduzida.size,quando:quando,enviadoEm:agoraISO(),
                  quem:usuario,login:meuLogin(),local:local,daGaleria:daGaleria||undefined};
      const ok=await acrescentarNaEsquadria(esqId,'fotos',item,'foto do vão');
      if(ok) feitas++; else excluirArquivoDoAnexo(item.url);
    }catch(err){
      aviso('Foto não enviada','"'+(f.name||'foto')+'": '+err.message+'\n\nConfira a internet e tente de novo.');
    }
  }
  redesenharFicha(esqId);
  if(feitas) status('🟢 '+feitas+' foto'+(feitas>1?'s':'')+' salva'+(feitas>1?'s':'')+' · '+agoraHora());
}

// ---- Audio: gravado no proprio celular (MediaRecorder). Sobe como "video"
// no Cloudinary, que e onde ele guarda audio.
let _gravador=null;
function tipoDeAudio(){
  const ops=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported) return '';
  return ops.find(function(t){ return MediaRecorder.isTypeSupported(t); })||'';
}
async function gravarAudio(esqId){
  if(recusarSeConsulta()) return;
  if(_gravador){ pararAudio(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
    // Navegador sem gravador: escolhe um arquivo de audio do celular.
    const inp=document.getElementById('audio-arq-'+esqId); if(inp) inp.click();
    return;
  }
  let fluxo;
  try{ fluxo=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ aviso('Microfone bloqueado','O navegador não liberou o microfone. Permita o uso do microfone para este site e tente de novo.'); return; }
  const tipo=tipoDeAudio();
  const rec=new MediaRecorder(fluxo,tipo?{mimeType:tipo}:undefined);
  const partes=[];
  rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) partes.push(ev.data); };
  _gravador={rec:rec,fluxo:fluxo,esqId:esqId,inicio:Date.now(),relogio:null};
  rec.onstop=async function(){
    const g=_gravador; _gravador=null;
    clearInterval(g.relogio);
    fluxo.getTracks().forEach(function(t){ t.stop(); });
    const blob=new Blob(partes,{type:rec.mimeType||tipo||'audio/webm'});
    const seg=Math.round((Date.now()-g.inicio)/1000);
    redesenharFicha(esqId);
    if(seg<1||!blob.size) return;
    await enviarAudio(esqId,blob,seg);
  };
  rec.start(1000);
  _gravador.relogio=setInterval(function(){
    const b=document.getElementById('btn-audio-'+esqId);
    if(b&&_gravador) b.textContent='⏹ Parar ('+fmtSeg(Math.round((Date.now()-_gravador.inicio)/1000))+')';
  },500);
  const b=document.getElementById('btn-audio-'+esqId);
  if(b){ b.textContent='⏹ Parar (0:00)'; b.classList.add('gravando'); }
}
function pararAudio(){ if(_gravador&&_gravador.rec.state!=='inactive') _gravador.rec.stop(); }
function fmtSeg(s){ s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function extensaoDoAudio(mime){ return /mp4|m4a|aac/.test(mime)?'m4a':/ogg/.test(mime)?'ogg':/mpeg|mp3/.test(mime)?'mp3':'webm'; }
async function enviarAudio(esqId,blob,seg){
  const e=esquadriaNaTela(esqId); if(!e) return;
  status('🎙 Enviando áudio...');
  try{
    const tipo=e.tipo||e.tipoPdf||'vao';
    const nome='audio_'+tipo+'_'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.'+extensaoDoAudio(blob.type);
    const j=await enviarArquivoPrivado(blob,'video',nome);
    const item={id:novoId(),url:j.secure_url,nome:nome,tamanho:blob.size,duracao:seg||Math.round(j.duration||0),
                quando:agoraISO(),quem:usuario,login:meuLogin()};
    const ok=await acrescentarNaEsquadria(esqId,'audios',item,'áudio técnico');
    if(!ok) excluirArquivoDoAnexo(item.url);
    else status('🟢 Áudio salvo · '+agoraHora());
  }catch(err){ aviso('Áudio não enviado',err.message+'\n\nConfira a internet e tente de novo.'); }
  redesenharFicha(esqId);
}
async function recebeuArquivoDeAudio(input){
  const esqId=input.getAttribute('data-e');
  const f=input.files&&input.files[0]; input.value='';
  if(!f||recusarSeConsulta()) return;
  if(f.size>25*1024*1024){ aviso('Áudio grande demais','O limite é 25 MB.'); return; }
  await enviarAudio(esqId,f,0);
}
async function ouvirAudio(btn){
  const url=btn.getAttribute('data-url'), nome=btn.getAttribute('data-nome');
  const lugar=btn.parentNode;
  btn.disabled=true; btn.textContent='Abrindo...';
  try{
    const u=await linkDoAnexo(url,nome,'ver');
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error('áudio '+r.status);
    const au=document.createElement('audio');
    au.controls=true; au.src=URL.createObjectURL(await r.blob()); au.style.cssText='width:100%;max-width:320px;height:36px';
    btn.replaceWith(au);
    au.play().catch(function(){});
  }catch(e){ btn.disabled=false; btn.textContent='▶ Ouvir'; aviso('Não consegui abrir o áudio',e.message); }
}

// ================= VISITAS (ETAPA 2) =================
// Cada visita a obra: data, hora, tipo, situacao de cada vao naquele dia,
// pendencias de terceiros (quem precisa fazer o que antes da nossa
// instalacao) e fotos. A situacao e um RETRATO do dia — nao muda a ficha.
const TIPOS_VISITA=['Medição','Acompanhamento','Vistoria','Entrega técnica','Outro'];
const SITUACOES=[{id:'liberado',nome:'Liberado'},{id:'nao',nome:'Não liberado'},{id:'naovisto',nome:'Não verificado'}];
let _visita=null, _visitaNovas=[];
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function horaAgora(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function htmlVisitas(a){
  const vs=(Array.isArray(a.visitas)?a.visitas:[]).slice().sort(function(x,y){ return String(y.data+y.hora).localeCompare(String(x.data+x.hora)); });
  let h='<div class="cab"><div class="cab-topo"><div class="cab-titulo" style="font-size:15px">Visitas'+(vs.length?' ('+vs.length+')':'')+'</div>'+
    (ehConsulta()?'':'<button class="btn btn-cor btn-sm" onclick="abrirVisita(null)">+ Registrar visita</button>')+'</div>';
  if(!vs.length) h+='<div class="depois">Nenhuma visita registrada ainda.</div>';
  vs.forEach(function(v){
    const vaos=v.vaos||[], lib=vaos.filter(function(x){ return x.situacao==='liberado'; }).length;
    const pend=(v.pendencias||[]).filter(function(p){ return p.texto; });
    h+='<div class="visita-linha" onclick="abrirVisita(\''+v.id+'\')">'+
      '<div><b>'+esc(fmtData(v.data))+(v.hora?' '+esc(v.hora):'')+'</b> · '+esc(v.tipo||'Visita')+' · '+esc(v.quem||'')+'</div>'+
      '<div class="obra-sub">'+(vaos.length?lib+' de '+vaos.length+' vão(s) liberado(s)':'')+
        (pend.length?' · <span style="color:var(--amber)">'+pend.length+' pendência(s) de terceiros</span>':'')+
        ((v.fotos||[]).length?' · '+v.fotos.length+' foto(s)':'')+'</div></div>';
  });
  h+='</div>';
  return h;
}

function abrirVisita(id){
  const a=acompDaObra(obraAberta); if(!a) return;
  const ja=id?(a.visitas||[]).find(function(v){ return v.id===id; }):null;
  if(id&&!ja) return;
  _visitaNovas=[];
  if(ja) _visita=copia(ja);
  else _visita={id:null,data:hojeISO(),hora:horaAgora(),tipo:'Medição',obs:'',fotos:[],pendencias:[{texto:'',de:''}],
    vaos:a.esquadrias.map(function(e){
      const c=valor(e,'condicao');
      return {esqId:e.id,tipo:valor(e,'tipo')||e.tipoPdf,local:valor(e,'local'),situacao:c==='liberado'?'liberado':c==='nao'?'nao':'naovisto',obs:''};
    })};
  // Esquadria nova depois da visita: aparece para completar, como "nao verificado".
  a.esquadrias.forEach(function(e){
    if(!_visita.vaos.some(function(x){ return x.esqId===e.id; }))
      _visita.vaos.push({esqId:e.id,tipo:valor(e,'tipo')||e.tipoPdf,local:valor(e,'local'),situacao:'naovisto',obs:''});
  });
  desenharVisita();
  document.getElementById('visita-ov').classList.add('open');
}
function desenharVisita(){
  // Alterar a visita: quem registrou, o gerente ou o administrador. Os demais
  // abrem para ler.
  const v=_visita, so=ehConsulta()||(!!v.id&&!podeTirar(v));
  const dis=so?' disabled':'';
  let h='<div class="grade grade-visita">'+
    '<div class="fg"><label>Data</label><input type="date" value="'+esc(v.data)+'"'+dis+' oninput="_visita.data=this.value"></div>'+
    '<div class="fg"><label>Hora</label><input type="time" value="'+esc(v.hora)+'"'+dis+' oninput="_visita.hora=this.value"></div>'+
    '<div class="fg"><label>Tipo</label><select'+dis+' onchange="_visita.tipo=this.value">'+TIPOS_VISITA.map(function(t){ return '<option'+(t===v.tipo?' selected':'')+'>'+esc(t)+'</option>'; }).join('')+'</select></div></div>';
  h+='<div class="secao"><h4>Situação dos vãos neste dia</h4>'+v.vaos.map(function(x,i){
    return '<div class="vv-linha"><div class="vv-tipo"><b>'+esc(x.tipo)+'</b>'+(x.local?'<br><span>'+esc(x.local)+'</span>':'')+'</div>'+
      '<div class="fg"><select'+dis+' onchange="_visita.vaos['+i+'].situacao=this.value">'+SITUACOES.map(function(s){ return '<option value="'+s.id+'"'+(s.id===x.situacao?' selected':'')+'>'+esc(s.nome)+'</option>'; }).join('')+'</select></div>'+
      '<div class="fg"><input placeholder="Obs. (ex.: falta reboco)" value="'+esc(x.obs)+'"'+dis+' oninput="_visita.vaos['+i+'].obs=this.value"></div></div>';
  }).join('')+'</div>';
  h+='<div class="secao"><h4>Pendências de terceiros</h4><div class="depois" style="margin-bottom:6px">O que outra equipe precisa fazer antes da nossa instalação (ex.: pedreiro, eletricista, gesseiro).</div>'+
    v.pendencias.map(function(p,i){
      return '<div class="grade2" style="grid-template-columns:2fr 1fr auto;margin-bottom:6px">'+
        '<div class="fg"><input placeholder="O que falta" value="'+esc(p.texto)+'"'+dis+' oninput="_visita.pendencias['+i+'].texto=this.value"></div>'+
        '<div class="fg"><input placeholder="De quem (ex.: pedreiro)" value="'+esc(p.de)+'"'+dis+' oninput="_visita.pendencias['+i+'].de=this.value"></div>'+
        (so?'':'<button class="btn btn-outline btn-sm" title="Tirar" onclick="_visita.pendencias.splice('+i+',1);desenharVisita()">×</button>')+'</div>';
    }).join('')+(so?'':'<button class="btn btn-outline btn-sm" onclick="_visita.pendencias.push({texto:\'\',de:\'\'});desenharVisita()">+ pendência</button>')+'</div>';
  h+='<div class="secao"><h4>Observações da visita</h4><div class="fg"><textarea'+dis+' oninput="_visita.obs=this.value">'+esc(v.obs)+'</textarea></div></div>';
  h+='<div class="secao"><h4>Fotos da visita'+(v.fotos.length?' ('+v.fotos.length+')':'')+'</h4>';
  if(v.fotos.length) h+='<div class="fotos">'+v.fotos.map(function(f){
    return '<div class="foto"><img data-mini="'+esc(f.url)+'" data-nome="'+esc(f.nome)+'" alt="Foto da visita" '+
      'onclick="verFoto(this.getAttribute(\'data-mini\'),this.getAttribute(\'data-nome\'),this.parentNode.querySelector(\'.foto-leg\').innerHTML)">'+
      '<div class="foto-leg">'+legendaDaFoto(f)+'</div>'+
      (so?(f.noRelatorio?'<div class="foto-rel on">★ no relatório</div>':''):
        '<button class="foto-rel'+(f.noRelatorio?' on':'')+'" onclick="marcarNoRelatorio(\''+f.id+'\')">'+(f.noRelatorio?'★ no relatório':'☆ pôr no relatório')+'</button>')+
      (so?'':'<button class="foto-x" title="Tirar esta foto" onclick="tirarFotoDaVisita(\''+f.id+'\')">×</button>')+'</div>';
  }).join('')+'</div>'+
  '<div class="depois" style="margin-top:4px">O relatório leva até 6 fotos: as marcadas com ★, ou as 6 primeiras se nenhuma for marcada.</div>';
  if(!so) h+='<div class="midia-botoes">'+
    '<label class="btn btn-cor btn-sm">📷 Tirar foto<input type="file" accept="image/*" capture="environment" onchange="recebeuFotosDaVisita(this,false)" hidden></label>'+
    '<label class="btn btn-outline btn-sm">🖼 Da galeria<input type="file" accept="image/*" multiple onchange="recebeuFotosDaVisita(this,true)" hidden></label></div>';
  h+='</div>';
  if(v.id) h+='<div class="depois" style="margin-top:10px">Registrada por '+esc(v.quem||'—')+' em '+esc(fmtQuando(v.criadoEm))+(v.editadoPor?' · alterada por '+esc(v.editadoPor)+' em '+esc(fmtQuando(v.editadoEm)):'')+'</div>';
  document.getElementById('visita-titulo').textContent=v.id?'Visita de '+fmtData(v.data):'Registrar visita';
  document.getElementById('visita-corpo').innerHTML=h;
  document.getElementById('visita-pe').innerHTML=
    (v.id?'<div class="pdf-botoes"><button class="btn btn-outline btn-sm" onclick="relatorioDaVisita(false)">📄 Relatório PDF</button>'+
      '<button class="btn btn-sm" style="background:#25D366;color:#fff;border-color:#1DA851" onclick="relatorioDaVisita(true)">📲 Enviar ao cliente</button></div>':'')+
    (v.id&&!so?'<button class="btn btn-outline" style="margin-right:auto;color:var(--red)" onclick="excluirVisita()">Excluir visita</button>':'')+
    '<button class="btn btn-outline" onclick="fecharVisita()">'+(so?'Fechar':'Cancelar')+'</button>'+
    (so?'':'<button class="btn btn-cor" id="btn-salvar-visita" onclick="salvarVisita()">💾 Salvar visita</button>');
  preencherMiniaturas(document.getElementById('visita-corpo'));
}
async function recebeuFotosDaVisita(input,daGaleria){
  const arquivos=Array.prototype.slice.call(input.files||[]);
  input.value='';
  if(!arquivos.length||recusarSeConsulta()) return;
  const local=daGaleria?null:await pegarLocal();
  for(let i=0;i<arquivos.length;i++){
    const f=arquivos[i];
    status('📷 Enviando foto '+(i+1)+' de '+arquivos.length+'...');
    try{
      const reduzida=await reduzirFoto(f);
      const nome='visita_'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'_'+(i+1)+'.jpg';
      const j=await enviarArquivoPrivado(reduzida,'image',nome);
      const item={id:novoId(),url:j.secure_url,nome:nome,tamanho:reduzida.size,
        quando:daGaleria&&f.lastModified?new Date(f.lastModified).toISOString():agoraISO(),enviadoEm:agoraISO(),
        quem:usuario,login:meuLogin(),local:local,daGaleria:daGaleria||undefined};
      if(!_visita){ excluirArquivoDoAnexo(item.url); return; }
      _visita.fotos.push(item); _visitaNovas.push(item.url);
    }catch(err){ aviso('Foto não enviada','"'+(f.name||'foto')+'": '+err.message); }
  }
  status('🟡 Foto(s) na visita — falta salvar');
  if(_visita) desenharVisita();
}
function marcarNoRelatorio(fid){
  if(!_visita) return;
  const f=_visita.fotos.find(function(x){ return x.id===fid; }); if(!f) return;
  if(!f.noRelatorio && _visita.fotos.filter(function(x){ return x.noRelatorio; }).length>=6){
    aviso('Já são 6','O relatório leva no máximo 6 fotos. Desmarque uma antes de marcar outra.'); return;
  }
  f.noRelatorio=!f.noRelatorio||undefined;
  desenharVisita();
}
// O relatorio sai do que esta SALVO: com alteracao na tela, salva antes.
function visitaMudou(){
  if(!_visita||!_visita.id) return true;
  const a=acompDaObra(obraAberta);
  const salva=a&&(a.visitas||[]).find(function(x){ return x.id===_visita.id; });
  return !salva || JSON.stringify(salva)!==JSON.stringify(_visita) || _visitaNovas.length>0;
}
async function relatorioDaVisita(enviar){
  if(!_visita||!_visita.id) return;
  if(visitaMudou()){
    if(!ehConsulta() && (podeTirar(_visita))){
      if(!confirm('Há alterações nesta visita. Salvar antes de gerar o relatório?')) return;
      const id=_visita.id;
      await salvarVisita();
      if(_visita) return;           // nao salvou: o aviso ja apareceu
      if(enviar) await enviarRelatorioWhats(id); else await gerarRelatorioPdf(id);
      return;
    }
  }
  const id=_visita.id;
  if(enviar) await enviarRelatorioWhats(id); else await gerarRelatorioPdf(id);
}
function tirarFotoDaVisita(fid){
  if(!_visita) return;
  const f=_visita.fotos.find(function(x){ return x.id===fid; }); if(!f) return;
  if(!podeTirar(f)){ aviso('Não dá para tirar','Só quem pôs a foto, o gerente ou o administrador pode tirar.'); return; }
  _visita.fotos=_visita.fotos.filter(function(x){ return x.id!==fid; });
  desenharVisita();
}
function fecharVisita(){
  if(_visitaNovas.length && !confirm('As fotos que você pôs nesta visita serão descartadas. Fechar sem salvar?')) return;
  // Fotos enviadas e nao salvas: apagadas (ninguem cita, o Worker apaga).
  _visitaNovas.forEach(function(u){ excluirArquivoDoAnexo(u); });
  _visitaNovas=[]; _visita=null;
  document.getElementById('visita-ov').classList.remove('open');
}
async function salvarVisita(){
  const v=_visita; if(!v) return;
  if(!v.data){ aviso('Falta a data','Preencha a data da visita.'); return; }
  const btn=document.getElementById('btn-salvar-visita'); if(btn) btn.disabled=true;
  v.pendencias=v.pendencias.filter(function(p){ return String(p.texto||'').trim()||String(p.de||'').trim(); });
  const nova=!v.id;
  const antes=nova?null:((acompDaObra(obraAberta)||{}).visitas||[]).find(function(x){ return x.id===v.id; });
  const o=obraPorId(obraAberta)||{};
  const deu=await alterar(function(base){
    const a=base.acompanhamentos.find(function(x){ return x.ctoId===obraAberta; });
    if(!a) return false;
    if(!Array.isArray(a.visitas)) a.visitas=[];
    const reg=copia(v);
    if(nova){ reg.id=novoId(); reg.quem=usuario; reg.login=meuLogin(); reg.criadoEm=agoraISO(); a.visitas.push(reg); }
    else {
      const i=a.visitas.findIndex(function(x){ return x.id===v.id; });
      if(i<0) return false;
      reg.editadoPor=usuario; reg.editadoEm=agoraISO();
      a.visitas[i]=reg;
    }
  },{acao:nova?'registrou visita':'alterou visita', alvo:(o.ct?o.ct+' · ':'')+(o.cliente||''), detalhe:fmtData(v.data)+' · '+v.tipo});
  if(btn) btn.disabled=false;
  if(!deu) return;
  // Foto tirada da visita ao editar (ou posta e tirada antes de salvar): o
  // arquivo pode ser apagado agora.
  const ficaram=function(u){ return v.fotos.some(function(x){ return x.url===u; }); };
  if(antes) (antes.fotos||[]).forEach(function(f){ if(!ficaram(f.url)) excluirArquivoDoAnexo(f.url); });
  _visitaNovas.forEach(function(u){ if(!ficaram(u)) excluirArquivoDoAnexo(u); });
  _visitaNovas=[]; _visita=null;
  document.getElementById('visita-ov').classList.remove('open');
  render();
}
async function excluirVisita(){
  const v=_visita; if(!v||!v.id) return;
  if(!confirm('Excluir a visita de '+fmtData(v.data)+'? As fotos dela também saem.')) return;
  const antes=((acompDaObra(obraAberta)||{}).visitas||[]).find(function(x){ return x.id===v.id; })||v;
  const o=obraPorId(obraAberta)||{};
  const deu=await alterar(function(base){

const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const JSPDF_SELO='sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk';
let _jspdf=null;
function carregarJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(_jspdf) return _jspdf;
  _jspdf=new Promise(function(ok,falhou){
    const s=document.createElement('script');
    s.src=JSPDF_URL; s.integrity=JSPDF_SELO; s.crossOrigin='anonymous';
    s.onload=function(){ if(window.jspdf&&window.jspdf.jsPDF) ok(window.jspdf.jsPDF); else falhou(new Error('o componente de PDF não carregou direito')); };
    s.onerror=function(){ _jspdf=null; falhou(new Error('não consegui baixar o componente de PDF (confira a internet)')); };
    document.head.appendChild(s);
  });
  return _jspdf;
}
const COR_MARCA=[181,101,29], COR_TEXTO=[35,40,47], COR_ROTULO=[110,118,128], COR_LINHA=[200,205,210], COR_FUNDO=[238,240,242];
// Nome de arquivo sem acento nem simbolo (o WhatsApp e o celular agradecem).
function nomeArquivo(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function txt(v){ return v==null?'':String(v); }
// Carrega uma imagem (dataURL ou endereco local) ja RECORTADA na proporcao
// pedida, como foto de quadro: preenche tudo, corta as sobras.
function imagemRecortada(src,proporcao,larguraPx){
  return new Promise(function(ok,falhou){
    const im=new Image();
    im.onload=function(){
      const W=larguraPx||900, H=Math.round(W/proporcao);
      const c=document.createElement('canvas'); c.width=W; c.height=H;
      const g=c.getContext('2d');
      const ri=im.naturalWidth/im.naturalHeight;
      let sw=im.naturalWidth, sh=im.naturalHeight, sx=0, sy=0;
      if(ri>proporcao){ sw=sh*proporcao; sx=(im.naturalWidth-sw)/2; } else { sh=sw/proporcao; sy=(im.naturalHeight-sh)/2; }
      g.fillStyle='#fff'; g.fillRect(0,0,W,H);
      g.drawImage(im,sx,sy,sw,sh,0,0,W,H);
      ok(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=function(){ falhou(new Error('imagem não abriu')); };
    im.src=src;
  });
}
// Imagem inteira (sem cortar), com o tamanho original — para os desenhos.
function tamanhoDaImagem(src){
  return new Promise(function(ok){ const im=new Image(); im.onload=function(){ ok({w:im.naturalWidth,h:im.naturalHeight}); }; im.onerror=function(){ ok(null); }; im.src=src; });
}

// as 6 primeiras. Sem foto na visita, as fotos dos vaos tiradas naquele dia.

  let todas=(v.fotos||[]).slice();

// ================= MONTAR AS FICHAS A PARTIR DO PDF =================
function docsDeMedicao(o){ return (o&&Array.isArray(o.docs))?o.docs.filter(function(d){ return d&&d.url; }):[]; }
function acompDaObra(id){ return (dados.acompanhamentos||[]).find(function(a){ return a.ctoId===id; })||null; }
function obraPorId(id){ return obras.find(function(o){ return o.id===id; })||null; }

// Le todos os PDFs de medicao da obra e fica com a revisao mais alta.
async function lerMedicaoDaObra(o){
  const docs=docsDeMedicao(o);
  if(!docs.length) throw new Error('esta obra não tem o PDF de medição anexado na Obra (rótulo "Medição")');
  const lidos=[];
  for(const d of docs){
    try{ const r=await lerSmartCem(d); if(r.esquadrias.length) lidos.push({doc:d,r:r}); }
    catch(e){ console.warn('Não consegui ler',d.nome,e); }
  }
  if(!lidos.length) throw new Error('não achei esquadrias no PDF de medição. Confira se é o PDF original do SmartCEM');
  lidos.sort(function(a,b){ return b.r.revisao-a.r.revisao || String(b.doc.quando||'').localeCompare(String(a.doc.quando||'')); });
  return {escolhido:lidos[0], total:docs.length};
}

// Mesmo cliente se os dois nomes tiverem pelo menos uma palavra de verdade em
// comum (sem acento; fora "de", "da", "dos"...). "CAROLINE SANTOS" e
// "CAROLINE SANTOS MATOS" batem; "PEDRO MARCELINO" e "SIDNEY SOBRINHO" nao.
// Folgado de proposito: obra cadastrada com apelido ou nome do casal nao
// pode virar alarme falso.
function mesmoCliente(a,b){
  const palavras=function(s){ return semAcento(s).toUpperCase().split(/[^A-Z0-9]+/).filter(function(p){ return p.length>=3 && ['DOS','DAS','EM','COM','LTDA','EIRELI','OBRA','RESIDENCIA','CASA'].indexOf(p)<0; }); };
  const pa=palavras(a), pb=palavras(b);
  if(!pa.length||!pb.length) return true;
  return pa.some(function(p){ return pb.indexOf(p)>=0; });
}
function avisosDaLeitura(o, lido, anterior){
  const avisos=[];
  const pdfProp=lido.escolhido.r.proposta;
  const cliPdf=lido.escolhido.r.cliente||'';
  if(cliPdf && o.cliente && !mesmoCliente(cliPdf,o.cliente))
    avisos.push('O cliente no PDF é "'+cliPdf+'", e a obra é "'+o.cliente+'". Confira se o PDF anexado é desta obra.');
  const todas=lido.escolhido.r.propostas||[];
  if(todas.length>1) avisos.push('Este PDF junta '+todas.length+' propostas: '+todas.join(', ')+'. Confira se todas são desta obra.');
  if(lido.total>1) avisos.push('Há '+lido.total+' PDFs de medição nesta obra. Usei o da revisão mais alta: '+nomeRev(lido.escolhido.r.revisao)+' ("'+lido.escolhido.doc.nome+'").');
  if(!o.proposta) avisos.push('A ficha da obra não tem o nº da proposta (ORC). O PDF diz '+(pdfProp||'(sem número)')+'.');
  else if(pdfProp && propostaSemRevisao(pdfProp)!==propostaSemRevisao(o.proposta))
    avisos.push('O nº da proposta no PDF ('+pdfProp+') é diferente do cadastrado na obra ('+o.proposta+'). Confira se o PDF é desta obra.');
  else if(pdfProp && revisaoDe(pdfProp)!==revisaoDe(o.proposta))
    avisos.push('O PDF é da revisão '+nomeRev(revisaoDe(pdfProp))+' e a obra está cadastrada com a '+nomeRev(revisaoDe(o.proposta))+'.');
  if(anterior && anterior.revisao!==undefined && anterior.revisao!==lido.escolhido.r.revisao)
    avisos.push('A revisão mudou: era '+nomeRev(anterior.revisao)+', agora é '+nomeRev(lido.escolhido.r.revisao)+'. As medidas já digitadas foram mantidas.');
  return avisos;
}

function esquadriaNova(e, doc){
  return {
    id:novoId(), tipoPdf:e.tipo,
    projeto:{tipo:e.tipo,local:e.local,qtde:e.qtde,dimL:e.dimL,dimH:e.dimH,dimTxt:e.dimTxt,cor:e.cor,vidro:e.vidro,descricao:e.descricao,linha:e.linha||''},
    desenho:e.desenho?Object.assign({doc:doc.id},e.desenho):null,
    notas:e.notas,
    tipo:e.tipo, local:e.local,
    lCima:'',lMeio:'',lBaixo:'',hEsq:'',hCentro:'',hDir:'',d1:'',d2:'',
    condicao:'', faltas:'', faltaOutro:'', obs:'', folgaL:'', folgaH:'',
    etapa:'medir', visto:null, historico:[]
  };
}

// Primeira leitura (ou releitura) do PDF. Na releitura as medidas digitadas
// ficam: muda so o que veio do projeto. Esquadria que saiu do PDF novo NAO e
// apagada — fica marcada, para alguem decidir.
async function montarFichas(o, releitura){
  if(recusarSeConsulta()) return;
  status('📄 Lendo o PDF...');
  let lido;
  try{ lido=await lerMedicaoDaObra(o); }
  catch(e){ status(''); aviso('Não consegui montar as fichas', 'Motivo: '+e.message+'.'); return; }
  const doc=lido.escolhido.doc, r=lido.escolhido.r;
  const deu=await alterar(function(base){
    let a=base.acompanhamentos.find(function(x){ return x.ctoId===o.id; });
    const anterior=a?a.origem:null;
    if(a && !releitura) return false;   // outra pessoa montou enquanto isso
    if(!a){ a={id:novoId(),ctoId:o.id,esquadrias:[],criadoEm:agoraISO(),criadoPor:usuario}; base.acompanhamentos.push(a); }
    a.ct=o.ct; a.cliente=o.cliente;
    a.origem={doc:doc.id,nome:doc.nome,url:doc.url,proposta:r.proposta,revisao:r.revisao,lidoEm:agoraISO(),lidoPor:usuario,
              docsVistos:docsDeMedicao(o).map(function(d){ return d.id; })};
    a.avisos=avisosDaLeitura(o,lido,anterior);
    // Releitura de fichas em que NINGUEM digitou nada: remonta do zero. E o
    // caso de PDF lido errado por versao antiga do leitor (22/10/2026: o
    // segundo modelo do SmartCEM juntava tudo no Tipo — "J01 1 600 3350
    // GOLD" — e a ficha nao casava mais com o "J01" lido certo).
    if(releitura && a.esquadrias.every(semNadaDigitado)) a.esquadrias=[];
    const vistos={};
    r.esquadrias.forEach(function(e){
      const ja=a.esquadrias.find(function(x){ return !vistos[x.id] && String(x.tipoPdf).toUpperCase()===String(e.tipo).toUpperCase(); });
      if(ja){
        vistos[ja.id]=1;
        ja.projeto={tipo:e.tipo,local:e.local,qtde:e.qtde,dimL:e.dimL,dimH:e.dimH,dimTxt:e.dimTxt,cor:e.cor,vidro:e.vidro,descricao:e.descricao,linha:e.linha||''};
        ja.desenho=e.desenho?Object.assign({doc:doc.id},e.desenho):null;
        ja.notas=e.notas;
        delete ja.foraDaRevisao;
      } else {
        const n=esquadriaNova(e,doc); vistos[n.id]=1; a.esquadrias.push(n);
      }
    });
    a.esquadrias.forEach(function(x){ if(!vistos[x.id]) x.foraDaRevisao=true; });
  }, {acao:releitura?'releu a medição':'montou as fichas', alvo:(o.ct?o.ct+' · ':'')+o.cliente,
      detalhe:r.esquadrias.length+' esquadria(s) · '+(r.proposta||doc.nome)});
  if(deu){ baseFichas={}; rascunho={}; render(); }
}

      '<button class="btn btn-cor btn-sm" onclick="relerMedicao()">Ler de novo</button></div>');
    if(a.origem) avisos.push('<div class="aviso-linha" style="background:var(--gray-2);color:var(--gray-5)">Fichas montadas de "'+esc(a.origem.nome)+'" ('+esc(a.origem.proposta||'sem nº')+') em '+esc(fmtQuando(a.origem.lidoEm))+' por '+esc(a.origem.lidoPor||'—')+'. '+
      '<a href="#" onclick="verPdfOriginal();return false">Ver o PDF</a>'+(ehConsulta()?'':' · <a href="#" onclick="relerMedicao();return false">Ler o PDF de novo</a>')+'</div>');
  }
  if(avisos.length) h+='<div class="avisos">'+avisos.join('')+'</div>';
  if(a) h+='<div class="pdf-botoes" style="margin-top:10px">'+
    '<button class="btn btn-outline btn-sm" onclick="gerarFichaPdf(true)" title="Para imprimir e levar à obra">📄 Ficha de medição em branco</button>'+
    '<button class="btn btn-outline btn-sm" onclick="gerarFichaPdf(false)">📄 Ficha de medição preenchida</button></div>';
  h+='</div>';
  if(!a){
    if(docsDeMedicao(o).length) h+='<div class="vazio">Montando as fichas a partir do PDF de medição... <br><br>'+
      (ehConsulta()?'':'<button class="btn btn-cor" onclick="montarFichas(obraPorId(obraAberta),false)">Montar as fichas agora</button>')+'</div>';
    else h+='<div class="vazio">Esta obra ainda não tem o PDF de medição.<br><br>No <b>Gerenciamento de Obra</b>, abra a ficha da obra e anexe o PDF do SmartCEM com o rótulo <b>Medição</b>. Depois volte aqui.</div>';
    tela.innerHTML=h;
    return;
  }
  a.esquadrias.forEach(function(e){ if(!baseFichas[e.id]) baseFichas[e.id]=copia(e); });
  h+=htmlVisitas(a);
  a.esquadrias.forEach(function(e){ h+=htmlFicha(a,e); });
  tela.innerHTML=h;
  a.esquadrias.forEach(function(e){ mostrarDesenho(a,e); });
  preencherMiniaturas(tela);
  consertarDesenhosVelhos(o,a);
}

// Fichas montadas antes da correcao de 21/10/2026 guardaram o RODAPE do PDF
// como desenho da ultima esquadria da pagina. O desenho do SmartCEM e uma
// figura estreita na coluna da esquerda (uns 130 pontos); o rodape e uma
// faixa larga. Achando um desses, le o PDF de novo uma vez, sozinho — a
// releitura troca so o que veio do projeto, as medidas ficam.
const _consertoTentado={};
function desenhoSuspeito(d){ return !!d && (d.w>250 || d.x+d.w>300); }
// Tipo lido com as medidas grudadas ("J01 1 600 3350 GOLD"): o PDF do segundo
// modelo do SmartCEM lido pelo leitor antigo (antes de 22/10/2026).
function tipoMalLido(e){ return /^\S+\s+\d+\s+\d+\s+\d+/.test(String(e.tipoPdf||'')); }
function semNadaDigitado(e){
  const campos=['lCima','lMeio','lBaixo','hEsq','hCentro','hDir','d1','d2','condicao','faltas','faltaOutro','obs','folgaL','folgaH'];
  return campos.every(function(c){ return !e[c]; }) && !(e.fotos||[]).length && !(e.audios||[]).length &&
    (!e.etapa||e.etapa==='medir') && String(e.tipo||'')===String(e.tipoPdf||'') && String(e.local||'')===String((e.projeto||{}).local||'');
}
function consertarDesenhosVelhos(o,a){
  if(_consertoTentado[a.id] || ehConsulta() || temRascunho() || _gravando) return;
  if(!a.esquadrias.some(function(e){ return desenhoSuspeito(e.desenho) || tipoMalLido(e); })) return;
  _consertoTentado[a.id]=true;
  montarFichas(o,true);
}

// Valor na tela: o que foi digitado e nao salvo, senao o do banco.
function valor(e,campo){
  const r=rascunho[e.id];
  if(r && Object.prototype.hasOwnProperty.call(r,campo)) return r[campo];
  return e[campo]==null?'':e[campo];
}
function menor(vals){ const n=vals.map(mm).filter(function(x){ return x!==null; }); return n.length?Math.min.apply(null,n):null; }
function contasDe(e){
  const L=menor([valor(e,'lCima'),valor(e,'lMeio'),valor(e,'lBaixo')]);
  const H=menor([valor(e,'hEsq'),valor(e,'hCentro'),valor(e,'hDir')]);
  const fL=mm(valor(e,'folgaL')), fH=mm(valor(e,'folgaH'));
  return {L:L,H:H,fL:fL,fH:fH,pL:(L!==null&&fL!==null)?L-fL:null,pH:(H!==null&&fH!==null)?H-fH:null};
}

function campoNum(e,campo,rot){
  const v=valor(e,campo), mudou=rascunho[e.id]&&Object.prototype.hasOwnProperty.call(rascunho[e.id],campo);
  return '<div class="fg"><label>'+esc(rot)+'</label><input inputmode="numeric" aria-label="'+esc((e.tipo||e.tipoPdf)+' · '+(CAMPOS_FICHA[campo]||rot))+'" data-e="'+e.id+'" data-c="'+campo+'" value="'+esc(v)+'"'+
    (mudou?' class="mudou"':'')+(ehConsulta()?' disabled':'')+' oninput="digitou(this)" placeholder="mm"></div>';
}
function campoTxt(e,campo,rot,ph){
  const v=valor(e,campo), mudou=rascunho[e.id]&&Object.prototype.hasOwnProperty.call(rascunho[e.id],campo);
  return '<div class="fg"><label>'+esc(rot)+'</label><input aria-label="'+esc((e.tipo||e.tipoPdf)+' · '+(CAMPOS_FICHA[campo]||rot))+'" data-e="'+e.id+'" data-c="'+campo+'" value="'+esc(v)+'"'+
    (mudou?' class="mudou"':'')+(ehConsulta()?' disabled':'')+' oninput="digitou(this)" placeholder="'+esc(ph||'')+'"></div>';
}

function htmlFicha(a,e){
  const p=e.projeto||{};
  const c=contasDe(e);
  const suja=rascunho[e.id]&&Object.keys(rascunho[e.id]).length;
  const etapa=valor(e,'etapa')||'medir';
  const cond=valor(e,'condicao');
  const faltas=String(valor(e,'faltas')||'').split(',').filter(Boolean);
  let h='<div class="ficha'+(suja?' suja':'')+'" id="ficha-'+e.id+'">'+

    '<span class="pill '+(etapa==='producao'?'pill-verde':etapa==='tecnico'?'pill-cor':etapa==='campo'?'pill-ambar':'')+'">'+
