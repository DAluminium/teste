<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque · Daluminium</title>
<style>
:root{--cor:#0E7C86;--cor-dark:#0A5C63;--cor-light:#E3F4F5;--red:#C0392B;--red-light:#FDF0EE;--amber:#B9770E;--amber-light:#FEF7E6;--green:#1A7A45;--green-light:#EDFAF3;--gray-1:#F7F8F9;--gray-2:#EEF0F2;--gray-3:#DEE1E5;--gray-4:#9AA1AB;--gray-5:#5A6370;--gray-6:#23282F;--radius:8px;--shadow:0 1px 4px rgba(0,0,0,0.07),0 0 0 0.5px rgba(0,0,0,0.05)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-1);color:var(--gray-6);font-size:14px;min-height:100vh}
.topbar{background:var(--cor-dark);color:#fff;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(0,0,0,.15);gap:8px}
.topbar-logo{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;min-width:0}
.topbar-logo span{opacity:.75;font-weight:400;font-size:13px}
.topbar-actions{display:flex;align-items:center;gap:8px}
#sync{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid transparent;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap}
.btn-ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
.btn-outline{background:#fff;color:var(--gray-6);border-color:var(--gray-3)}.btn-outline:hover{background:var(--gray-1)}
.btn-cor{background:var(--cor);color:#fff;border-color:var(--cor-dark)}.btn-cor:hover{background:var(--cor-dark)}
.btn-verde{background:var(--green);color:#fff;border-color:#14532d}
.btn-verm{background:var(--red);color:#fff;border-color:#922b21}
.btn-sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.main{max-width:1150px;margin:0 auto;padding:1rem 1rem 5rem}
.abas{display:flex;gap:4px;border-bottom:2px solid var(--gray-3);margin-bottom:12px;overflow-x:auto}
.aba{padding:9px 16px;border:0;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--gray-5);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.aba.on{color:var(--cor-dark);border-bottom-color:var(--cor)}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.barra .busca{flex:1;min-width:200px;margin:0}
.busca{width:100%;padding:9px 12px;border:1px solid var(--gray-3);border-radius:var(--radius);font-family:inherit;font-size:14px;background:#fff}
.filtros{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;align-items:center}
.filtros label{display:flex;gap:5px;align-items:center;cursor:pointer}
.filtros select{padding:5px 8px;border:1px solid var(--gray-3);border-radius:6px;font-family:inherit;font-size:13px;background:#fff}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.resumo div{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:10px 12px}
.resumo b{display:block;font-size:20px;color:var(--cor-dark)}
.resumo span{font-size:12px;color:var(--gray-5)}
.resumo .alerta b{color:var(--amber)}
.lista{display:flex;flex-direction:column;gap:6px}
.linha{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;cursor:pointer;border-left:4px solid var(--gray-3)}
.linha:hover{background:var(--cor-light)}
.linha.baixo{border-left-color:var(--amber)}
.linha.zerado{border-left-color:var(--red)}
.linha.ok{border-left-color:var(--green)}
.fig{width:84px;height:63px;background:var(--gray-1);border:1px solid var(--gray-2);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:10px;color:var(--gray-4);text-align:center}
.fig img{width:100%;height:100%;object-fit:contain;background:#fff}
.fig.grande{width:100%;max-width:370px;height:auto;aspect-ratio:370/278;margin:0 auto}
.cod{font-weight:700;font-size:14px;color:var(--cor-dark)}
.desc{font-size:13px;margin-top:1px}
.sub{font-size:12px;color:var(--gray-5);margin-top:2px}
.saldo{text-align:right;min-width:90px}
.saldo b{font-size:20px;display:block;line-height:1.1}
.saldo span{font-size:11px;color:var(--gray-5)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--gray-2);color:var(--gray-5);white-space:nowrap}
.pill-cor{background:var(--cor-light);color:var(--cor-dark)}
.pill-verde{background:var(--green-light);color:var(--green)}
.pill-ambar{background:var(--amber-light);color:var(--amber)}
.pill-verm{background:var(--red-light);color:var(--red)}
.vazio{text-align:center;color:var(--gray-4);padding:30px 10px;font-style:italic}
.rola{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:var(--shadow)}
.rola .tabela{box-shadow:none}
.tabela{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.tabela th{background:var(--gray-2);text-align:left;padding:7px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-5)}
.tabela td{padding:7px 9px;border-top:1px solid var(--gray-2);vertical-align:top}
.tabela tr.estornado td{color:var(--gray-4);text-decoration:line-through}
.tabela tr.estornado td.acoes{text-decoration:none}
.num{text-align:right;white-space:nowrap}
.mais{color:var(--green);font-weight:700}.menos{color:var(--red);font-weight:700}
.figs-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.fig-cel{border:1px solid var(--gray-3);border-radius:8px;background:#fff;padding:4px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left}
.fig-cel:hover{border-color:var(--cor);background:var(--cor-light)}
.fig-cel img,.fig-cel .falta{width:100%;aspect-ratio:370/278;object-fit:contain;background:#fff}
.fig-cel .falta{display:flex;align-items:center;justify-content:center;background:var(--gray-1);color:var(--gray-4);font-size:10.5px;font-style:italic}
.fig-cel span{font-size:11.5px;font-weight:600;color:var(--gray-6);word-break:break-all}
.fig-cel small{font-size:10.5px;color:var(--green)}
.paginas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:.6rem}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(560px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--gray-2);display:flex;align-items:center;gap:8px}
.modal-title{font-size:15px;font-weight:700;flex:1}
.modal-body{padding:14px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--gray-2);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;color:var(--gray-5);margin-bottom:3px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 9px;border:1px solid var(--gray-3);border-radius:7px;font-family:inherit;font-size:14px;background:#fff}
.fg textarea{min-height:56px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--cor)}
.fg small{display:block;font-size:11.5px;color:var(--gray-4);margin-top:3px}
.escolhido{display:flex;gap:10px;align-items:center;background:var(--cor-light);border-radius:8px;padding:6px 8px;margin-bottom:10px}
.escolhido .fig{width:72px;height:54px}
.aviso-linha{border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.5;margin-bottom:8px}
.aviso-ambar{background:var(--amber-light);color:#7a4e07;border:1px solid #F5D98A}
.aviso-azul{background:var(--cor-light);color:var(--cor-dark);border:1px solid #B7E0E3}
.aviso-verm{background:var(--red-light);color:var(--red);border:1px solid #F3C7C1}
.secao{margin-top:14px}
.secao h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-5);margin-bottom:6px}
.cor-linha{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--gray-2);font-size:13px}
.cor-linha input{width:80px;padding:5px 7px;border:1px solid var(--gray-3);border-radius:6px;font-family:inherit;font-size:13px}
.bloqueio{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:24px;text-align:center;color:var(--gray-5)}
@media (max-width:700px){
  .topbar-logo span{display:none}
  .linha{grid-template-columns:64px 1fr auto;gap:8px}
  .linha .fig{width:64px;height:48px}
  .tabela .some-cel{display:none}
  .grade2{grid-template-columns:1fr}
}
@media (max-width:480px){
  .topbar{padding:0 .6rem}
  .topbar-logo{font-size:15px;white-space:nowrap}
  .topbar-actions{gap:5px}
  #sync{font-size:10.5px;max-width:84px;white-space:normal;line-height:1.2;text-align:right}
  .main{padding:.7rem .7rem 5rem}
}
</style>
<script>
// ---- MODO ESPELHO ("Ver como", pedido do Ander, 16/10/2026) ----
// Mesmo bloco dos outros modulos: na aba em que o admin ve o sistema como
// outra pessoa, nada le, grava nem apaga o armazenamento que as abas dividem.
try{ if(sessionStorage.getItem('dalum-espelho')){ (function(){
  const L=window.localStorage, P=Storage.prototype, ler=P.getItem, gravar=P.setItem, tirar=P.removeItem, limpar=P.clear;
  P.getItem=function(k){ return this===L?null:ler.call(this,k); };
  P.setItem=function(k,v){ if(this!==L) return gravar.call(this,k,v); };
  P.removeItem=function(k){ if(this!==L) return tirar.call(this,k); };
  P.clear=function(){ if(this!==L) return limpar.call(this); };
})(); } }catch(e){}

// Marca que este modulo esta aberto DENTRO do portal, para o CSS esconder a
// faixa duplicada.
try{ if(window.self!==window.top) document.documentElement.classList.add('dentro-do-portal'); }
catch(e){ document.documentElement.classList.add('dentro-do-portal'); }
</script>
</head>
<body>
<!-- ================================================================
     AVISO DE AMBIENTE DE TESTE

     Motivo: em 11/08/2026 contas reais foram lancadas aqui achando que
     era producao, porque as duas telas eram identicas.
     ================================================================ -->
<div id="faixa-teste">Ambiente de teste &middot; o que voce lancar aqui nao vale</div>
<style>
  #faixa-teste{position:fixed;top:0;left:0;right:0;height:30px;z-index:100000;
    background:repeating-linear-gradient(45deg,#B9770E 0 14px,#8a5a0a 14px 28px);

<div class="bloqueio" id="bloqueio">Abrindo...</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">&#128230; Estoque <span>perfis e componentes</span></div>
    <div class="topbar-actions">
      <span id="sync"></span>
      <button class="btn btn-ghost btn-sm" id="btn-sair" onclick="sairDoModulo()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="abas" id="abas"></div>
    <div id="tela"></div>
  </div>
</div>

<div class="overlay" id="aviso-ov" style="z-index:400">
  <div class="modal" style="width:min(480px,100%)">
    <div class="modal-head"><div class="modal-title" id="aviso-titulo">Aviso</div></div>
    <div class="modal-body"><div id="aviso-texto" style="font-size:13.5px;line-height:1.6;white-space:pre-line"></div></div>
    <div class="modal-foot"><button class="btn btn-cor" id="aviso-btn" onclick="fecharAviso()">Entendi</button></div>
  </div>
</div>

<div class="overlay" id="pergunta-ov" style="z-index:410">
  <div class="modal" style="width:min(480px,100%)">
    <div class="modal-head"><div class="modal-title" id="pergunta-titulo">Confirmar</div></div>
    <div class="modal-body"><div id="pergunta-texto" style="font-size:13.5px;line-height:1.6;white-space:pre-line"></div></div>
    <div class="modal-foot"><button class="btn btn-outline" id="pergunta-nao" onclick="responderPergunta(false)">Cancelar</button>
      <button class="btn btn-cor" id="pergunta-sim" onclick="responderPergunta(true)">Confirmar</button></div>
  </div>
</div>

<!-- Janela de uso geral (movimento, material, sobra, detalhe) -->
<div class="overlay" id="janela-ov" style="z-index:300">
  <div class="modal" id="janela-modal">
    <div class="modal-head"><div class="modal-title" id="janela-titulo"></div>
      <button class="btn btn-outline btn-sm" onclick="fecharJanela()">Fechar</button></div>
    <div class="modal-body" id="janela-corpo"></div>
    <div class="modal-foot" id="janela-pe"></div>
  </div>
</div>

<script>
// ================= CONFIG =================
const WORKER='https://daluminium-api.daluminium2.workers.dev';
// Identificador do sistema no banco: SEM acento (vai num cabecalho HTTP).
// Producao: 'estoque'.
const SUPA_SISTEMA='estoque_teste';
// ATENCAO: muda de teste para producao, igual ao SUPA_SISTEMA acima.
// Producao: https://daluminium.github.io/portal/
const PORTAL_URL='https://daluminium.github.io/teste/';
const AMBIENTE = /_teste$/.test(SUPA_SISTEMA) ? 'teste' : 'producao';
const LS_KEY='dalum-estoque';
const LS_OBRAS='dalum-estoque-obras';
const TOKEN_KEY='dalum-token';
// Copia local de TODOS os modulos (mesmo endereco, mesmo armazenamento): sair
// de qualquer um limpa todos. Lista igual a dos outros, mais as deste modulo.
const DADOS_LOCAIS=['dalum-data','fin-data','dalum-fabrica','dalum-obra','dalum-crm','dalum-crm-para-obra','dalum-crm-abrir',
  'portal-admin-passes','dalum-admin-passes','fin-admin-passes','dalum-acomp','dalum-acomp-obras',LS_KEY,LS_OBRAS];

// Perfil e contado em BARRAS por codigo + cor (decisao do Ander, 29/10/2026);
// a sobra (retalho) fica a parte, cada peca com o seu comprimento.
// Componente e contado na unidade do SmartCEM (PC, MT, PR...).
const UNIDADES_COMPONENTE=['PC','MT','PR','RL','TB','PT','CX','KG','LT','UN'];
const NOME_UNIDADE={BARRA:'barra(s)',PC:'peça(s)',MT:'metro(s)',PR:'par(es)',RL:'rolo(s)',TB:'tubo(s)',PT:'pacote(s)',CX:'caixa(s)',KG:'kg',LT:'litro(s)',UN:'unidade(s)'};
const CORES_PADRAO=['NATURAL','PINTURA PRETO FOSCO - RAL9005F','PINTURA BRANCA','PINTURA MARROM FOSCO - RAL8014','ANODIZADO FOSCO-1000 (A23)','BRONZE','PRETO','BRANCO'];
const PASTA_PERFIS='daluminium_perfis';

let dados={materiais:[],movimentos:[],sobras:[],historico:[]};
let obras=[];              // recorte da Obra (CT, cliente, ORC) que o Worker entrega
let usuario='', papel='', login='';
let aba='saldo';
let filtro={busca:'',tipo:'',situacao:'',zerados:false};
let filtroHist={busca:'',tipo:''};
let filtroSobras={busca:''};
let _gravando=0, _versaoLocal=0;

// ================= UTILIDADES =================
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function novoId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function agoraISO(){ return new Date().toISOString(); }
function agoraHora(){ return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function diaLocal(iso){
  const d=new Date(iso); if(isNaN(d)) return String(iso||'').slice(0,10);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtQuando(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function semAcento(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function status(txt,cor){ const e=document.getElementById('sync'); if(e){ e.textContent=txt; e.style.color=cor||'rgba(255,255,255,.85)'; } }
// Quantidade: aceita "12", "66,28", "1.250,5" e "1.250" (= mil duzentos e
// cinquenta, como se escreve aqui — no teste de 04/11 o "1.250" virava 1,25 mm).
// Devolve null se nao for numero.
function numero(v){
  let t=String(v==null?'':v).trim().replace(/\s+/g,''); if(!t) return null;
  if(t.indexOf(',')>=0) t=t.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  const n=parseFloat(t); return isFinite(n)?n:null;
}
function arred(n){ return Math.round(n*1000)/1000; }
function fmtNum(n){ return (Math.round((n||0)*1000)/1000).toLocaleString('pt-BR',{maximumFractionDigits:3}); }
// Codigo como o SmartCEM escreve: maiusculo, sem espaco sobrando.
function normCodigo(c){ return String(c||'').trim().replace(/\s+/g,' ').toUpperCase(); }
function normCor(c){ return String(c||'').trim().replace(/\s+/g,' ').toUpperCase(); }
function chave(matId,cor){ return matId+'|'+normCor(cor); }
// Texto dentro de onclick="...": vira string de JavaScript e depois atributo
// de HTML. So o esc() nao basta (o &#39; volta a ser ' antes do JavaScript ler).
function jsArg(v){ return esc(JSON.stringify(String(v==null?'':v))); }

// ================= AVISOS NA TELA =================
let _avisoAoFechar=null;
function aviso(titulo, texto, aoFechar){
  document.getElementById('aviso-titulo').textContent=titulo||'Aviso';
  document.getElementById('aviso-texto').textContent=texto||'';
  _avisoAoFechar=aoFechar||null;
  document.getElementById('aviso-ov').classList.add('open');
  setTimeout(function(){ const b=document.getElementById('aviso-btn'); if(b) b.focus(); },60);
}
function fecharAviso(){
  document.getElementById('aviso-ov').classList.remove('open');
  const fn=_avisoAoFechar; _avisoAoFechar=null;
  if(fn) fn();
}
// Pergunta na janela do proprio sistema (o confirm() do navegador, no
// celular, parece defeito e as vezes nem aparece). Devolve true no "sim".
let _perguntaResp=null;
function perguntar(titulo, texto, sim, perigo){
  document.getElementById('pergunta-titulo').textContent=titulo||'Confirmar';
  document.getElementById('pergunta-texto').textContent=texto||'';
  const b=document.getElementById('pergunta-sim');
  b.textContent=sim||'Confirmar';
  b.style.background=perigo?'var(--red)':''; b.style.borderColor=perigo?'var(--red)':'';
  document.getElementById('pergunta-ov').classList.add('open');
  setTimeout(function(){ const n=document.getElementById('pergunta-nao'); if(n) n.focus(); },60);
  return new Promise(function(ok){ _perguntaResp=ok; });
}
function responderPergunta(r){
  document.getElementById('pergunta-ov').classList.remove('open');
  const fn=_perguntaResp; _perguntaResp=null;
  if(fn) fn(r);
}
function abrirJanela(titulo, corpo, pe, largura){
  document.getElementById('janela-titulo').textContent=titulo;
  document.getElementById('janela-corpo').innerHTML=corpo;
  document.getElementById('janela-pe').innerHTML=pe||'';
  document.getElementById('janela-pe').style.display=pe?'flex':'none';
  document.getElementById('janela-modal').style.width='min('+(largura||560)+'px,100%)';
  document.getElementById('janela-ov').classList.add('open');
}
function fecharJanela(){ document.getElementById('janela-ov').classList.remove('open'); _janelaAtual=null; }
let _janelaAtual=null;   // o que a janela mostra, para redesenhar depois de gravar

// ================= CRACHA E SESSAO (igual aos outros modulos) =================
function loginGuardaLer(chave){
  try{ const v=sessionStorage.getItem(chave); if(v!==null) return v; }catch(e){}
  try{ return localStorage.getItem(chave); }catch(e){ return null; }
}
function loginGuardaApagar(chave){
  let meu=null;
  try{ meu=sessionStorage.getItem(chave); }catch(e){}
  try{ sessionStorage.removeItem(chave); }catch(e){}
  try{ if(meu===null || localStorage.getItem(chave)===meu) localStorage.removeItem(chave); }catch(e){}
}
function lerSSO(){
  try{
    const s=JSON.parse(loginGuardaLer('dalum-sso')||'null');
    if(!s||!s.nome) return null;
    if(Date.now()-s.ts>8*60*60*1000){ loginGuardaApagar('dalum-sso'); return null; }
    return s;
  }catch(e){ return null; }
}
function b64urlParaTexto(s){
  const b64=s.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(b64+'==='.slice((b64.length+3)%4));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function lerToken(){
  try{
    const t=loginGuardaLer(TOKEN_KEY);
    if(!t) return null;
    const partes=t.split('.');
    if(partes.length!==2) return null;
    const d=JSON.parse(b64urlParaTexto(partes[0]));
    if(!d||!d.exp||Date.now()>=d.exp){ loginGuardaApagar(TOKEN_KEY); return null; }
    return {token:t,dados:d};
  }catch(e){ loginGuardaApagar(TOKEN_KEY); return null; }
}
function cabecalhos(extra){
  const h=Object.assign({'X-Sistema':SUPA_SISTEMA},extra||{});
  const t=lerToken();
  if(t) h['Authorization']='Bearer '+t.token;
  return h;
}
function apagarDadosLocais(){ DADOS_LOCAIS.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} }); }
function soAdmin(){ return papel==='admin'; }
function gerenteOuAdmin(){ return papel==='admin'||papel==='gerente'; }
// Consulta, ou o Estoque marcado "so ver" no cadastro da pessoa: so olha.
// Quem trava de verdade e o Worker; aqui a tela so evita que a pessoa digite
// e perca.
function ehConsulta(){
  if(papel==='consulta') return true;
  try{ const t=lerToken(); const v=(t&&t.dados&&Array.isArray(t.dados.v))?t.dados.v:[]; return v.indexOf('estoque')>=0; }catch(e){ return false; }
}
function ehEspelho(){ try{ return !!sessionStorage.getItem('dalum-espelho'); }catch(e){ return false; } }
function recusarSeConsulta(){
  if(ehEspelho()){
    aviso('Modo espelho','Você está vendo o sistema como outra pessoa, só para olhar.\n\nNada foi gravado.');
    return true;
  }
  if(!ehConsulta()) return false;
  aviso('Modo consulta','Você pode olhar, mas não alterar.\n\nNada foi gravado.');
  return true;
}

  const r=await fetch(WORKER,{method:'POST',

    body:JSON.stringify(Object.assign({sessionId:_sessionId, ambiente:AMBIENTE}, corpo||{}))});
  if(!r.ok) throw new Error('worker '+r.status);
  return r.json();
}

function sessaoExpirada(){
  if(window.__sessaoExpirada) return;
  window.__sessaoExpirada=true;
  try{ loginGuardaApagar(TOKEN_KEY); loginGuardaApagar('dalum-sso'); }catch(e){} apagarDadosLocais();
  aviso('Sessão expirada','O acesso vale 8 horas e o seu venceu. O que você já tinha salvo continua guardado.\n\nVamos voltar para a tela de entrada.',
    function(){
      if(window.self!==window.top){ try{ window.parent.postMessage('logout','*'); }catch(e){} setTimeout(function(){ location.reload(); },800); return; }
      location.reload();
    });
}

// ================= DADOS DO PROPRIO MODULO =================
function arrumar(j){
  if(!j||typeof j!=='object'||Array.isArray(j)) j={};
  ['materiais','movimentos','sobras','historico'].forEach(function(k){ if(!Array.isArray(j[k])) j[k]=[]; });
  return j;
}
// Ler sempre sem cache: no-store e um parametro que muda a cada chamada.
async function buscarRemoto(){
  const r=await fetch(WORKER+'?t='+Date.now()+'-'+Math.random().toString(36).slice(2,7),{cache:'no-store',headers:cabecalhos()});
  if(r.status===503){ telaBloqueio('Sistema em manutenção','Estamos ajustando o sistema. Seus dados estão guardados.'); throw new Error('manutencao'); }
  if(r.status===403){ telaBloqueio('Sem acesso a este módulo','Seu acesso não inclui o Estoque' + (AMBIENTE==='teste'?' (ou este é o ambiente de teste, que é só para administradores e gerentes)':'') + '. Peça ao administrador para liberar.'); throw new Error('Acesso negado'); }
  if(r.status===401){ sessaoExpirada(); throw new Error('Sessao expirada'); }
  if(!r.ok) throw new Error('Worker '+r.status);
  const j=await r.json();
  // Registro inexistente: o Worker devolve null. Nao e "vazio de verdade".
  if(!j||typeof j!=='object'||Array.isArray(j)) return null;
  return arrumar(j);
}
// A Obra, pelo recorte do Worker: so CT, ano, cliente, status e ORC. O
// Estoque nunca grava na Obra.
async function buscarObras(){
  const r=await fetch(WORKER+'?t='+Date.now()+'-'+Math.random().toString(36).slice(2,7),{cache:'no-store',
    headers:cabecalhos({'X-Action':'obras-do-estoque'})});
  if(r.status===401){ sessaoExpirada(); throw new Error('Sessao expirada'); }
  if(!r.ok) throw new Error('Obra '+r.status);
  const j=await r.json();
  return (j&&Array.isArray(j.contratos))?j.contratos:[];
}
// GRAVACAO CONDICIONAL (20/10/2026): manda a versao que leu (X-Base). Se outra
// pessoa gravou no meio, o Worker responde 409 e nada e gravado por cima.
async function enviarRemoto(payload, versaoLida){
  const extra={'Content-Type':'application/json'};
  if(versaoLida) extra['X-Base']=versaoLida;
  const r=await fetch(WORKER,{method:'PATCH',headers:cabecalhos(extra),body:JSON.stringify({data:payload})});
  if(r.status===401){ sessaoExpirada(); throw new Error('Sessao expirada'); }
  if(r.status===409) return 'conflito';
  if(!r.ok) throw new Error('Worker '+r.status);
  return 'ok';
}
function logGeral(base, acao, alvo, detalhe){
  if(!Array.isArray(base.historico)) base.historico=[];
  base.historico.unshift({id:novoId(), ts:agoraISO(), user:usuario||'—', acao:acao, alvo:alvo||'—', detalhe:detalhe||''});
  if(base.historico.length>500) base.historico=base.historico.slice(0,500);
}
function lerLocal(){
  try{ const s=localStorage.getItem(LS_KEY); if(s) dados=JSON.parse(s); }catch(e){}
  dados=arrumar(dados);
  try{ const o=JSON.parse(localStorage.getItem(LS_OBRAS)||'null'); if(Array.isArray(o)) obras=o; }catch(e){}
}
function gravarLocal(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(dados)); localStorage.setItem(LS_OBRAS,JSON.stringify(obras)); }catch(e){}
}

// Toda alteracao passa por aqui: rele o banco, aplica a mudanca em cima do que
// esta la e grava com X-Base. O saldo nunca e gravado: sai da soma dos
// movimentos, entao duas pessoas lancando juntas nao se apagam. Confere depois
// pelo carimbo, porque o Worker ja respondeu "ok" sem gravar.
// fn(base) devolve false para desistir, ou uma frase de erro para recusar.
async function alterar(fn, registro){
  if(recusarSeConsulta()) return false;
  _versaoLocal++; _gravando++;
  try{ return await gravarAlteracao(fn, registro); }
  finally{ _gravando--; }
}
async function gravarAlteracao(fn, registro){
  status('🔄 Salvando...');
  try{
    let base=null, carimbo='';
    for(let tentativa=0; tentativa<4; tentativa++){
      base=null;
      try{ base=await buscarRemoto(); }catch(e){ base=null; }
      // Sem conseguir ler o banco NAO grava: gravar a copia local por cima
      // poderia apagar o que um colega salvou.
      if(!base) throw new Error('sem leitura');
      const versaoLida=String(base.atualizadoEm||'');
      const ok=fn(base);
      if(ok===false){ status('🟡 Nada salvo'); return false; }
      if(typeof ok==='string'){ status('🟡 Nada salvo'); aviso('Não foi salvo',ok); return false; }
      if(registro){
        try{ const r=(typeof registro==='function')?registro(base):registro; if(r&&r.acao) logGeral(base,r.acao,r.alvo,r.detalhe); }catch(e){}
      }
      carimbo=agoraISO();
      base.atualizadoEm=carimbo; base.atualizadoPor=usuario;
      const deu=await enviarRemoto(base, versaoLida);
      if(deu!=='conflito') break;
      status('🔀 Outra pessoa salvou junto — juntando...');
      if(tentativa===3) throw new Error('conflito');
      await new Promise(function(ok){ setTimeout(ok,300+Math.random()*700); });
    }
    let confere=null;
    try{ confere=await buscarRemoto(); }catch(e){ confere=null; }
    const depoisDeMim=!!confere && confere.atualizadoEm!==carimbo &&
      new Date(confere.atualizadoEm).getTime()>new Date(carimbo).getTime();
    if(!confere || (confere.atualizadoEm!==carimbo && !depoisDeMim)){
      status('🔴 NÃO gravou no servidor','#ffcccc');
      aviso('NÃO foi salvo','O servidor respondeu que deu certo, mas ao conferir, a informação não estava lá.\n\n'+
        'Não continue: avise o responsável pelo sistema.');
      return false;
    }
    dados=confere; gravarLocal();
    status('🟢 Salvo · '+agoraHora());
    render();
    return true;
  }catch(e){
    status('🔴 Não salvou','#ffcccc');
    aviso('Não foi possível salvar','Verifique a internet e tente de novo.\n\nNada foi lançado.');
    return false;
  }
}

async function sincronizar(){
  if(_gravando) return;
  const versao=_versaoLocal;
  status('🔄 Buscando...');
  try{
    const [d,o]=await Promise.all([buscarRemoto(), buscarObras().catch(function(){ return null; })]);
    if(_gravando || versao!==_versaoLocal) return;
    if(d) dados=d;
    if(o) obras=o;
    gravarLocal();
    render();
    status('🟢 Atualizado · '+agoraHora());
  }catch(e){
    render();
    status('🔴 Sem conexão — dados locais','#ffcccc');
  }
}
async function atualizarDoBanco(){
  if(_gravando) return;
  // Janela aberta ou campo em uso: nao redesenha por baixo de quem digita.
  if(document.getElementById('janela-ov').classList.contains('open')) return;
  const foco=document.activeElement;
  if(foco && /INPUT|TEXTAREA|SELECT/.test(foco.tagName)) return;
  sincronizar();
}

function materialPorId(id){ return dados.materiais.find(function(m){ return m.id===id; })||null; }
function materialPorCodigo(cod, base){
  const c=normCodigo(cod); if(!c) return null;
  return ((base||dados).materiais).find(function(m){ return normCodigo(m.codigo)===c && !m.inativo; })||null;
}
function unidadeDe(m){ return m&&m.tipo==='perfil'?'BARRA':((m&&m.unidade)||'PC'); }
function nomeUnidade(m,n){ const u=unidadeDe(m); return NOME_UNIDADE[u]||u.toLowerCase(); }
// Saldo de cada material + cor = soma dos movimentos (entrada +, saida -,
// acerto +/-, estorno = o contrario do movimento estornado).
function calcularSaldos(base){
  const b=base||dados, s={};
  b.movimentos.forEach(function(mv){
    const k=chave(mv.matId,mv.cor);
    if(!s[k]) s[k]={matId:mv.matId,cor:normCor(mv.cor),saldo:0,ultimo:''};
    s[k].saldo=arred(s[k].saldo+(Number(mv.delta)||0));
    if(String(mv.quando)>s[k].ultimo) s[k].ultimo=mv.quando;
  });
  return s;
}
function saldoDe(matId,cor,base){ const s=calcularSaldos(base)[chave(matId,cor)]; return s?s.saldo:0; }
function sobrasLivres(base){ return (base||dados).sobras.filter(function(x){ return !x.saiu; }); }
function minimoDe(m,cor){ const mi=(m&&m.minimos)||{}; const v=mi[normCor(cor)]; return (typeof v==='number')?v:null; }
// As linhas da tela de saldo: toda cor que ja teve movimento, toda cor com
// minimo marcado, e o material sem cor nenhuma quando ainda nao teve nada.
function linhasDeSaldo(){
  const saldos=calcularSaldos(), linhas={};
  Object.keys(saldos).forEach(function(k){ linhas[k]=saldos[k]; });
  dados.materiais.forEach(function(m){
    if(m.inativo) return;
    Object.keys(m.minimos||{}).forEach(function(cor){ const k=chave(m.id,cor); if(!linhas[k]) linhas[k]={matId:m.id,cor:cor,saldo:0,ultimo:''}; });
  });
  const sob={};
  sobrasLivres().forEach(function(x){ const k=chave(x.matId,x.cor); sob[k]=(sob[k]||0)+1; });
  Object.keys(sob).forEach(function(k){ if(!linhas[k]){ const p=k.split('|'); linhas[k]={matId:p[0],cor:p.slice(1).join('|'),saldo:0,ultimo:''}; } });
  const comLinha={}; Object.keys(linhas).forEach(function(k){ comLinha[linhas[k].matId]=1; });
  dados.materiais.forEach(function(m){ if(!m.inativo && !comLinha[m.id]) linhas[chave(m.id,'')]={matId:m.id,cor:'',saldo:0,ultimo:''}; });
  return Object.keys(linhas).map(function(k){
    const l=linhas[k], m=materialPorId(l.matId);
    if(!m||m.inativo) return null;
    const min=minimoDe(m,l.cor);
    let sit='ok';
    if(l.saldo<=0) sit='zerado';
    else if(min!==null && l.saldo<min) sit='baixo';
    return {m:m, cor:l.cor, saldo:l.saldo, minimo:min, sobras:sob[k]||0, situacao:sit, ultimo:l.ultimo};
  }).filter(Boolean);
}
function coresConhecidas(){
  const c={};
  CORES_PADRAO.forEach(function(x){ c[x]=1; });
  dados.movimentos.forEach(function(x){ if(x.cor) c[normCor(x.cor)]=1; });
  dados.sobras.forEach(function(x){ if(x.cor) c[normCor(x.cor)]=1; });
  return Object.keys(c).sort();
}
function obraPorId(id){ return obras.find(function(o){ return o.id===id; })||null; }
function rotuloObra(o){ if(!o) return ''; return (o.ct?o.ct+' · ':'')+(o.cliente||'')+(o.proposta?' ('+o.proposta+')':''); }

// ================= FIGURAS DOS PERFIS =================
// A biblioteca do SmartCEM (15.360 figuras, Figuras-Perf.rar de 29/10/2026)
// fica no Cloudinary PRIVADO, pasta daluminium_perfis, com o codigo limpo como
// nome. A LISTA [codigo, nome na nuvem] fica em perfis-lista.json, ao lado
// deste arquivo. O endereco de cada figura vem do Worker ('perfis-links').
let _listaPerfis=null, _mapaPerfis=null;
function carregarListaPerfis(){
  if(_listaPerfis) return _listaPerfis;
  _listaPerfis=fetch('perfis-lista.json',{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('lista de figuras não encontrada ('+r.status+')');
    return r.json();
  }).then(function(j){
    const l=(j.itens||[]).map(function(i){ return {codigo:i[0], id:i[1]}; });
    _mapaPerfis={}; l.forEach(function(x){ _mapaPerfis[x.codigo]=x.id; });
    return l;
  });
  _listaPerfis.catch(function(){ _listaPerfis=null; });
  return _listaPerfis;
}
function figuraDoCodigo(cod){ return _mapaPerfis?(_mapaPerfis[normCodigo(cod)]||null):null; }
const _figLink={};
async function linksDeFiguras(ids){
  const faltam=ids.filter(function(id,i){ return id && !_figLink[id] && ids.indexOf(id)===i; });
  for(let i=0;i<faltam.length;i+=60){
    const lote=faltam.slice(i,i+60);
    const r=await fetch(WORKER,{method:'POST',cache:'no-store',
      headers:cabecalhos({'Content-Type':'application/json','X-Action':'perfis-links'}),
      body:JSON.stringify({ids:lote})});
    let j=null; try{ j=await r.json(); }catch(e){}
    if(r.status===401){ sessaoExpirada(); throw new Error('sessão expirada'); }
    if(!r.ok||!j||!j.links) throw new Error((j&&j.erro)||('erro '+r.status));
    Object.keys(j.links).forEach(function(k){ _figLink[k]=j.links[k]; });
  }
  return ids.map(function(id){ return _figLink[id]; });
}
// Caixa da figura: <div class="fig" data-cod="LG068">. Depois de desenhar a
// tela, preencherFiguras() troca o texto pela imagem.
function caixaFigura(cod, extra){
  return '<div class="fig'+(extra?' '+extra:'')+'" data-cod="'+esc(normCodigo(cod))+'">…</div>';
}
async function preencherFiguras(raiz){
  const caixas=Array.prototype.slice.call((raiz||document).querySelectorAll('.fig[data-cod]:not([data-ok])'));
  if(!caixas.length) return;
  try{ await carregarListaPerfis(); }catch(e){ caixas.forEach(function(c){ c.textContent='sem lista'; }); return; }
  const ids=[];
  caixas.forEach(function(c){
    const id=figuraDoCodigo(c.getAttribute('data-cod'));
    c.setAttribute('data-ok','1');
    if(!id){ c.textContent='sem figura'; return; }
    c.setAttribute('data-fig',id); ids.push(id);
  });
  if(!ids.length) return;
  try{
    await linksDeFiguras(ids);
    caixas.forEach(function(c){
      const id=c.getAttribute('data-fig'); if(!id||!_figLink[id]) return;
      const im=new Image(); im.alt=''; im.loading='lazy';
      im.onerror=function(){ c.textContent='figura ainda não carregada'; };
      im.src=_figLink[id];
      c.textContent=''; c.appendChild(im);
    });
  }catch(e){ caixas.forEach(function(c){ if(c.textContent==='…') c.textContent='—'; }); }
}

function render(){
  if(document.getElementById('app').style.display==='none') return;
  const abas=[['saldo','Saldo'],['sobras','Sobras'],['historico','Histórico'],['figuras','Figuras']];
  document.getElementById('abas').innerHTML=abas.map(function(a){
    return '<button class="aba'+(aba===a[0]?' on':'')+'" onclick="trocarAba(\''+a[0]+'\')">'+a[1]+'</button>';
  }).join('');
  const t=document.getElementById('tela');
  if(aba==='saldo') t.innerHTML=telaSaldo();
  else if(aba==='sobras') t.innerHTML=telaSobras();
  else if(aba==='historico') t.innerHTML=telaHistorico();
  else { t.innerHTML='<div id="figuras-corpo"></div>'; desenharFiguras(); }
  if(aba!=='figuras') preencherFiguras(t);

function bateBusca(q, campos){
  if(!q) return true;
  const alvo=semAcento(campos.join(' '));
  return q.split(/\s+/).every(function(p){ return alvo.indexOf(p)>=0; });
}

function telaSaldo(){
  const todas=linhasDeSaldo();
  const q=semAcento(filtro.busca).trim();
  const linhas=todas.filter(function(l){
    if(filtro.tipo && l.m.tipo!==filtro.tipo) return false;
    if(filtro.situacao==='baixo' && !(l.situacao==='baixo'||(l.situacao==='zerado'&&l.minimo!==null))) return false;
    if(filtro.situacao==='sobras' && !l.sobras) return false;
    if(!filtro.zerados && !q && !filtro.situacao && l.saldo===0 && !l.sobras && l.minimo===null && l.ultimo) return false;

  }).sort(function(a,b){

    return pa-pb || normCodigo(a.m.codigo).localeCompare(normCodigo(b.m.codigo)) || a.cor.localeCompare(b.cor) || (p[a.situacao]-p[b.situacao]);

    '<option value="componente"'+(filtro.tipo==='componente'?' selected':'')+'>Só componentes</option></select>'+
    '<select onchange="filtro.situacao=this.value;render()"><option value="">Todas as situações</option>'+
    '<option value="baixo"'+(filtro.situacao==='baixo'?' selected':'')+'>Abaixo do mínimo</option>'+
    '<option value="sobras"'+(filtro.situacao==='sobras'?' selected':'')+'>Com sobras</option></select>'+
    '<label><input type="checkbox"'+(filtro.zerados?' checked':'')+' onchange="filtro.zerados=this.checked;render()"> Mostrar os que zeraram</label>'+
    '<span style="color:var(--gray-5)">'+linhas.length+' linha(s)</span></div>';
  if(!dados.materiais.length){
    h+='<div class="vazio">Nenhum material cadastrado ainda.<br><br>O jeito mais rápido: <b>📥 Importar</b> a Lista de materiais de uma obra do SmartCEM, ou uma planilha do Excel.<br>'+

    // Vermelho e para o que ACABOU; o que nunca teve lancamento fica cinza

    const cls=(l.minimo!==null&&l.saldo<l.minimo)?'baixo':(l.saldo>0?'ok':(l.ultimo?'zerado':''));

// Ninguem apaga lancamento: quem errou estorna (um lancamento ao contrario,
// que fica no historico). Quem lancou estorna o proprio no mesmo dia;
// gerente e admin, qualquer um.
function podeEstornar(mv){
  if(ehConsulta()||ehEspelho()) return false;
  if(mv.tipo==='estorno' || mv.estornadoPor) return false;
  if(gerenteOuAdmin()) return true;
  return mv.login && mv.login===login && diaLocal(mv.quando)===diaLocal(agoraISO());
}
async function estornar(id){
  const mv=dados.movimentos.find(function(x){ return x.id===id; }); if(!mv) return;
  const m=materialPorId(mv.matId)||{codigo:'?'};
  if(!await perguntar('Estornar lançamento',NOME_TIPO_MOV[mv.tipo]+' de '+fmtNum(Math.abs(mv.delta))+' '+nomeUnidade(m)+' de '+m.codigo+(mv.cor?' ('+mv.cor+')':'')+
    ', em '+fmtQuando(mv.quando)+' por '+mv.quem+'.\n\nO sistema lança o contrário e os dois ficam no histórico.','Estornar',true)) return;
  await alterar(function(base){
    const o=base.movimentos.find(function(x){ return x.id===id; });
    if(!o) return 'Este lançamento não existe mais.';
    if(o.estornadoPor) return 'Este lançamento já foi estornado por '+o.estornadoPor.quem+'.';
    const novo={id:novoId(),matId:o.matId,cor:o.cor,tipo:'estorno',delta:arred(-(Number(o.delta)||0)),estornoDe:o.id,quando:agoraISO(),quem:usuario,login:login};
    o.estornadoPor={quem:usuario,quando:novo.quando,movId:novo.id};
    base.movimentos.push(novo);
  },{acao:'estornou lançamento',alvo:m.codigo+(mv.cor?' · '+mv.cor:''),detalhe:NOME_TIPO_MOV[mv.tipo]+' '+fmtNum(mv.delta)});
}

function abrirDetalhe(matId){

function desenharDetalhe(matId){
  const m=materialPorId(matId);
  if(!m){ fecharJanela(); return; }
  const saldos=calcularSaldos();
  const cores={};
  Object.keys(saldos).forEach(function(k){ if(saldos[k].matId===m.id) cores[saldos[k].cor]=saldos[k].saldo; });
  Object.keys(m.minimos||{}).forEach(function(c){ if(!(c in cores)) cores[c]=0; });
  sobrasLivres().forEach(function(s){ if(s.matId===m.id && !(normCor(s.cor) in cores)) cores[normCor(s.cor)]=0; });
  const ro=ehConsulta()||ehEspelho();
  const un=nomeUnidade(m);
  let h='<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:10px">'+
    (m.tipo==='perfil'?caixaFigura(m.codigo,'grande'):'')+
    '<div><div class="cod" style="font-size:18px">'+esc(m.codigo)+'</div><div class="desc">'+esc(m.descricao||'')+'</div>'+
    '<div class="sub">'+(m.tipo==='perfil'?'Perfil · barra de '+fmtNum(m.barraMm||6000)+' mm':'Componente · em '+esc(un))+
    (m.criadoPor?' · cadastrado por '+esc(m.criadoPor):'')+'</div></div></div>';
  h+='<div class="secao"><h4>Saldo por cor</h4>';
  const lista=Object.keys(cores).sort();
  if(!lista.length) h+='<div class="vazio" style="padding:10px">Ainda sem nenhum lançamento.</div>';
  h+=lista.map(function(c){
    const min=minimoDe(m,c), s=cores[c], baixo=min!==null&&s<min;
    const nSob=sobrasLivres().filter(function(x){ return x.matId===m.id&&normCor(x.cor)===c; }).length;
    return '<div class="cor-linha"><div><b>'+(c?esc(c):'<i>sem cor</i>')+'</b>'+(nSob?' <span class="pill pill-cor">'+nSob+' sobra(s)</span>':'')+
      (baixo?' <span class="pill pill-ambar">abaixo do mínimo</span>':'')+'</div>'+
      '<div class="num"><b class="'+(s<0?'menos':'')+'">'+fmtNum(s)+'</b> <span class="sub">'+esc(un)+'</span></div>'+
      '<div title="Estoque mínimo desta cor">'+(ro?(min!==null?'mín. '+fmtNum(min):''):
        '<span class="sub">mín.</span> <input type="text" inputmode="decimal" placeholder="mínimo" value="'+(min!==null?fmtNum(min):'')+'" onchange="gravarMinimo(\''+m.id+'\','+jsArg(c)+',this.value)">')+'</div></div>';
  }).join('')+'</div>';
  const movs=dados.movimentos.filter(function(x){ return x.matId===m.id; }).sort(function(a,b){ return String(b.quando).localeCompare(String(a.quando)); });
  h+='<div class="secao"><h4>Lançamentos'+(movs.length>30?' (30 mais recentes de '+movs.length+')':'')+'</h4>'+
    (movs.length?tabelaMovimentos(movs.slice(0,30),false):'<div class="vazio" style="padding:10px">Nenhum.</div>')+'</div>';
  const pe=ro?'':
    '<button class="btn btn-outline" onclick="abrirMaterial(\''+m.id+'\')">Editar cadastro</button>'+
    '<button class="btn btn-outline" onclick="abrirAjuste(\''+m.id+'\')">Acertar contagem</button>'+
    (m.tipo==='perfil'?'<button class="btn btn-outline" onclick="abrirSobra(\''+m.id+'\')">+ Sobra</button>':'')+
    '<button class="btn btn-verm" onclick="abrirMovimento(\'saida\',\''+m.id+'\')">− Saída</button>'+
    '<button class="btn btn-verde" onclick="abrirMovimento(\'entrada\',\''+m.id+'\')">+ Entrada</button>';
  abrirJanela(m.codigo, h, pe, 680);
  preencherFiguras(document.getElementById('janela-corpo'));
}
async function gravarMinimo(matId, cor, valor){
  const v=String(valor).trim()===''?null:numero(valor);
  if(v!==null && (v<0)){ aviso('Mínimo inválido','O mínimo precisa ser um número igual ou maior que zero.'); render(); return; }
  if(String(valor).trim()!=='' && v===null){ aviso('Mínimo inválido','Digite só o número (ex.: 10).'); render(); return; }
  const m=materialPorId(matId);
  await alterar(function(base){
    const b=base.materiais.find(function(x){ return x.id===matId; });
    if(!b) return 'Este material não existe mais.';
    if(!b.minimos) b.minimos={};
    const c=normCor(cor);
    if(v===null){ if(!(c in b.minimos)) return false; delete b.minimos[c]; }
    else { if(b.minimos[c]===v) return false; b.minimos[c]=v; }
    b.editadoPor=usuario; b.editadoEm=agoraISO();
  },{acao:'mudou o mínimo',alvo:(m?m.codigo:'')+(cor?' · '+cor:''),detalhe:v===null?'sem mínimo':fmtNum(v)});
}

async function salvarMaterial(matId, depois){
  const tipo=document.getElementById('mt-tipo').value;
  const codigo=normCodigo(document.getElementById('mt-cod').value);
  const descricao=document.getElementById('mt-desc').value.trim();
  const barra=numero(document.getElementById('mt-barra').value);
  const unidade=document.getElementById('mt-un').value;
  const inativo=!!(document.getElementById('mt-inativo')&&document.getElementById('mt-inativo').checked);
  if(!codigo){ aviso('Falta o código','Digite o código do material (o mesmo do SmartCEM).'); return; }
  if(tipo==='perfil' && !(barra>0)){ aviso('Comprimento da barra','Digite o comprimento da barra em milímetros (ex.: 6000).'); return; }
  let novoId_=matId||novoId();
  const deu=await alterar(function(base){
    const repetido=base.materiais.find(function(x){ return x.id!==matId && !x.inativo && normCodigo(x.codigo)===codigo; });
    if(repetido) return 'Já existe um material com o código '+codigo+' ('+(repetido.descricao||'sem descrição')+').';
    if(matId){
      const b=base.materiais.find(function(x){ return x.id===matId; });
      if(!b) return 'Este material não existe mais.';
      b.codigo=codigo; b.descricao=descricao;
      if(b.tipo==='perfil') b.barraMm=barra; else b.unidade=unidade;
      if(inativo) b.inativo=true; else delete b.inativo;
      b.editadoPor=usuario; b.editadoEm=agoraISO();
    } else {
      const n={id:novoId_,tipo:tipo,codigo:codigo,descricao:descricao,minimos:{},criadoPor:usuario,criadoEm:agoraISO()};
      if(tipo==='perfil') n.barraMm=barra; else n.unidade=unidade;
      base.materiais.push(n);
    }
  },{acao:matId?'editou material':'cadastrou material',alvo:codigo,detalhe:descricao});
  if(!deu) return;
  fecharJanela();
  if(depois) depois(novoId_); else abrirDetalhe(novoId_);
}

async function salvarMovimento(){

      const s=saldoDe(m.id,cor,base);

async function salvarAjuste(matId){
  const m=materialPorId(matId);
  const cor=normCor(document.getElementById('aj-cor').value);
  const contado=numero(document.getElementById('aj-qtd').value);
  const obs=document.getElementById('aj-obs').value.trim();
  if(contado===null||contado<0){ aviso('Quantidade','Digite quanto tem de verdade (zero ou mais).'); return; }
  if(m.tipo==='perfil' && Math.round(contado)!==contado){ aviso('Quantidade de barras','Perfil é contado em barras inteiras.'); return; }
  if(!obs){ aviso('Falta o motivo','Escreva o motivo do acerto (ex.: inventário, barra danificada).'); return; }
  let dif=0;
  const deu=await alterar(function(base){
    const antes=saldoDe(matId,cor,base);
    dif=arred(contado-antes);
    if(!dif) return 'O sistema já mostra '+fmtNum(antes)+'. Nada a acertar.';
    base.movimentos.push({id:novoId(),matId:matId,cor:cor,tipo:'ajuste',delta:dif,contado:contado,antes:antes,obs:obs,quando:agoraISO(),quem:usuario,login:login});
  },function(){ return {acao:'acertou contagem',alvo:m.codigo+(cor?' · '+cor:''),detalhe:'contado '+fmtNum(contado)+' ('+(dif>0?'+':'')+fmtNum(dif)+')'}; });
  if(deu) abrirDetalhe(matId);
}

// ================= LER A "LISTA DE MATERIAIS" DO SMARTCEM =================
// O relatorio "Relacao de Materiais" traz PERFIS (codigo, descricao, cor,
// barra em mm...) e COMPONENTES (codigo, descricao, qtde com unidade...).
// Daqui sai so o CADASTRO: a lista diz o que a obra precisa, nao o que ha no
// deposito. Leitura pela POSICAO (medida no PDF de 04/11/2026):
//  - o codigo fica na coluna "Codigo"; uma linha so conta se tiver tambem a
//    barra (perfil) ou a quantidade (componente) na mesma altura;
//  - a descricao comeca na coluna "Descricao" e, quando e longa, continua nas
//    linhas de baixo (ex.: "(PORTFOLIO)", "BAAN 657200604");
//  - barra e quantidade sao alinhadas pela DIREITA, sob o titulo da coluna.
// paginas = [[{s,x,y,w}]] (y cresce para cima, como no PDF).
// BEGIN-LEITOR (o teste no computador copia daqui ate END-LEITOR)
function lerListaDeMateriais(paginas){
  const tudo=[].concat.apply([],paginas.map(function(p){ return p; }));
  const ehLista=tudo.some(function(t){ return /Rela[cç][aã]o de Materiais/i.test(t.s); });
  const res={ehLista:ehLista, proposta:'', cliente:'', perfis:[], componentes:[]};
  const orc=tudo.find(function(t){ return /^ORC-[\w-]+$/.test(t.s.trim()); }); if(orc) res.proposta=orc.s.trim();
  const cabCli=tudo.find(function(t){ return t.s.trim()==='Cliente:'; });
  if(cabCli){ const v=tudo.filter(function(t){ return Math.abs(t.y-cabCli.y)<2 && t.x>cabCli.x+cabCli.w; }).sort(function(a,b){ return a.x-b.x; })[0]; if(v) res.cliente=v.s.trim(); }
  const SECOES={'PERFIS':'perfis','COMPONENTES':'componentes','VIDROS':'fora','SUPERFÍCIES':'fora','SUPERFICIES':'fora'};
  let secao=null, col=null;
  const porCodigo={perfis:{}, componentes:{}};
  const perto=function(a,b,tol){ return Math.abs(a-b)<=tol; };
  paginas.forEach(function(pg){
    const itens=pg.slice().sort(function(a,b){ return b.y-a.y || a.x-b.x; });
    // Titulos de secao e cabecalhos desta pagina, de cima para baixo.
    const marcos=[];
    itens.forEach(function(t){
      const s=t.s.trim();
      if(SECOES[s] && t.x>250) marcos.push({y:t.y, secao:SECOES[s]});
      if(s==='Código') marcos.push({y:t.y, cab:itens.filter(function(u){ return perto(u.y,t.y,1.5); })});
    });
    // Codigos candidatos (coluna da esquerda), em ordem de cima para baixo.
    const eventos=[];
    marcos.forEach(function(m){ eventos.push({y:m.y, marco:m}); });
    itens.forEach(function(t){ eventos.push({y:t.y, item:t}); });
    eventos.sort(function(a,b){ return b.y-a.y || (a.marco?-1:1); });
    const linhasDeCodigo=[];
    eventos.forEach(function(ev){
      if(ev.marco){
        if(ev.marco.secao){ secao=ev.marco.secao; col=null; }
        if(ev.marco.cab && (secao==='perfis'||secao==='componentes')){
          const achar=function(rx){ return ev.marco.cab.find(function(u){ return rx.test(u.s.trim()); }); };
          const cod=achar(/^C[oó]digo$/), desc=achar(/^Descri[cç][aã]o$/), barra=achar(/^Barra$/), qtde=achar(/^Qtde$/), trat=achar(/^Tratamento/);
          if(cod && desc) col={secao:secao, codX:cod.x, descX:desc.x, tratX:trat?trat.x:null,
            barraDir:barra?barra.x+barra.w:null, qtdeDir:qtde?qtde.x+qtde.w:null};
        }
        return;
      }
      const t=ev.item;
      if(!col || col.secao!==secao) return;
      const s=t.s.trim();
      if(!perto(t.x,col.codX,3) || !/^[A-Z0-9][A-Z0-9 ._\/()-]*$/i.test(s) || /^(Obra|C[oó]digo|Total:?)$/i.test(s)) return;
      const mesma=itens.filter(function(u){ return u!==t && perto(u.y,t.y,1.5); });
      const dir=secao==='perfis'?col.barraDir:col.qtdeDir;
      const valor=dir===null?null:mesma.find(function(u){ return u.x+u.w>=dir-7 && u.x+u.w<=dir+9; });
      if(!valor) return;
      linhasDeCodigo.push({t:t, mesma:mesma, valor:valor, secao:secao, col:col});
    });
    linhasDeCodigo.forEach(function(L,i){
      // Para no proximo codigo OU no proximo titulo/cabecalho (no ultimo perfil,
      // o "Descricao" do cabecalho dos componentes entrava na descricao dele).
      let abaixo=(i+1<linhasDeCodigo.length)?linhasDeCodigo[i+1].t.y:-1;
      marcos.forEach(function(mk){ if(mk.y<L.t.y-1.5 && mk.y>abaixo) abaixo=mk.y; });
      // Descricao: tudo que COMECA na coluna Descricao, da linha do codigo ate
      // a proxima linha de codigo (as continuacoes ficam embaixo).
      const partes=itens.filter(function(u){ return perto(u.x,L.col.descX,10) && u.y<=L.t.y+1.5 && u.y>abaixo+1.5 && u.y>70; })
        .sort(function(a,b){ return b.y-a.y; }).map(function(u){ return u.s.trim(); });
      const codigo=L.t.s.trim().replace(/\s+/g,' ').toUpperCase();
      const descricao=partes.join(' ').replace(/\s+/g,' ').trim();
      if(L.secao==='perfis'){
        const barra=parseInt(String(L.valor.s).replace(/\D/g,''),10)||null;
        const cor=L.col.tratX===null?'':(L.mesma.filter(function(u){ return perto(u.x,L.col.tratX,10); }).map(function(u){ return u.s.trim(); }).join(' '));
        const ja=porCodigo.perfis[codigo];
        if(ja){ if(cor && ja.cores.indexOf(cor)<0) ja.cores.push(cor); if(!ja.descricao) ja.descricao=descricao; return; }
        porCodigo.perfis[codigo]={codigo:codigo, descricao:descricao, barraMm:barra, cores:cor?[cor]:[]};
        res.perfis.push(porCodigo.perfis[codigo]);
      } else {
        const m=String(L.valor.s).trim().match(/([A-Za-z]{1,4})\.?$/);
        const unidade=m?m[1].toUpperCase():'PC';
        if(porCodigo.componentes[codigo]) return;
        porCodigo.componentes[codigo]={codigo:codigo, descricao:descricao, unidade:unidade};
        res.componentes.push(porCodigo.componentes[codigo]);
      }
    });
  });
  return res;
}

const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_SELO='sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e';
const PDFJS_AJUDANTE_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDFJS_AJUDANTE_SELO='sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2';
let _pdfjs=null;
function carregarPdfJs(){
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise(function(ok,falhou){
    const s=document.createElement('script');
    s.src=PDFJS_URL; s.integrity=PDFJS_SELO; s.crossOrigin='anonymous';
    s.onload=async function(){
      try{
        const lib=window.pdfjsLib;
        if(!lib) throw new Error('o leitor de PDF não carregou direito');
        const r=await fetch(PDFJS_AJUDANTE_URL,{integrity:PDFJS_AJUDANTE_SELO,mode:'cors'});
        if(!r.ok) throw new Error('não consegui baixar o leitor de PDF');
        lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));
        ok(lib);
      }catch(e){ _pdfjs=null; falhou(e); }
    };
    s.onerror=function(){ _pdfjs=null; falhou(new Error('não consegui baixar o leitor de PDF (confira a internet)')); };
    document.head.appendChild(s);
  });
  return _pdfjs;
}
async function pedacosDoPdf(arquivo){
  const lib=await carregarPdfJs();
  const doc=await lib.getDocument({data:new Uint8Array(await arquivo.arrayBuffer())}).promise;
  const paginas=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    paginas.push(tc.items.filter(function(i){ return i.str&&i.str.trim(); }).map(function(i){
      return {s:i.str, x:Math.round(i.transform[4]*10)/10, y:Math.round(i.transform[5]*10)/10, w:Math.round(i.width*10)/10};
    }));
  }
  return paginas;
}

// ================= LER UMA PLANILHA (EXCEL OU CSV) =================
// Pedido do Ander (04/11/2026): alem do PDF, cadastrar por planilha. A
// primeira linha com "Codigo" e o cabecalho; os titulos sao reconhecidos de
// varios jeitos (sem acento, maiuscula ou minuscula). So o Codigo e
// obrigatorio. Tipo: "perfil" (ou unidade BARRA, ou Barra preenchida) vira
// perfil; o resto, componente. Devolve o mesmo formato do leitor do PDF.
// linhas = [[celula, celula...], ...] como sai do leitor de Excel.
// BEGIN-PLANILHA (o teste no computador copia daqui ate END-PLANILHA)
const UNIDADE_DA_PLANILHA={PC:'PC','PÇ':'PC',PCS:'PC',PECA:'PC','PEÇA':'PC',PECAS:'PC','PEÇAS':'PC',UN:'UN',UND:'UN',UNID:'UN',UNIDADE:'UN',
  M:'MT',MT:'MT',MTS:'MT',METRO:'MT',METROS:'MT',ML:'MT',PR:'PR',PAR:'PR',PARES:'PR',RL:'RL',ROLO:'RL',ROLOS:'RL',
  TB:'TB',TUBO:'TB',TUBOS:'TB',PT:'PT',PCT:'PT',PACOTE:'PT',CX:'CX',CAIXA:'CX',KG:'KG',QUILO:'KG',LT:'LT',L:'LT',LITRO:'LT'};
function lerPlanilhaDeMateriais(linhas){
  const limpo=function(v){ return String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); };
  const res={ehLista:true, proposta:'', cliente:'', perfis:[], componentes:[], ignoradas:[], cabecalho:false};
  let iCab=-1;
  for(let i=0;i<Math.min(linhas.length,15);i++){
    if((linhas[i]||[]).some(function(c){ return /^(codigo|cod|cod produto|codigo do produto|referencia|ref)$/.test(limpo(c)); })){ iCab=i; break; }
  }
  if(iCab<0) return res;
  res.cabecalho=true;
  const cab=linhas[iCab].map(limpo);
  const coluna=function(rx){ return cab.findIndex(function(c){ return rx.test(c); }); };
  const cCod=coluna(/^(codigo|cod|cod produto|codigo do produto|referencia|ref)$/);
  const cDesc=coluna(/^(descricao|desc|nome|produto|material)/);
  const cTipo=coluna(/^(tipo|categoria)$/);
  const cUn=coluna(/^(unidade|un|und|unid|medida)$/);
  const cBarra=coluna(/^(barra|barra mm|comprimento|comprimento mm|comprimento da barra|comprimento da barra mm|tamanho da barra)$/);
  const vistos={};
  for(let i=iCab+1;i<linhas.length;i++){
    const l=linhas[i]||[];
    const codigo=String(l[cCod]==null?'':l[cCod]).trim().replace(/\s+/g,' ').toUpperCase();
    if(!codigo){ if(l.some(function(c){ return String(c==null?'':c).trim(); })) res.ignoradas.push({linha:i+1, motivo:'sem código'}); continue; }
    if(vistos[codigo]){ res.ignoradas.push({linha:i+1, motivo:codigo+' repetido (vale a linha '+vistos[codigo]+')'}); continue; }
    vistos[codigo]=i+1;
    const descricao=cDesc<0?'':String(l[cDesc]==null?'':l[cDesc]).trim().replace(/\s+/g,' ');
    const tipoTxt=cTipo<0?'':limpo(l[cTipo]);
    const unTxt=cUn<0?'':String(l[cUn]==null?'':l[cUn]).trim().toUpperCase().replace(/\.$/,'');
    const barraTxt=cBarra<0?'':String(l[cBarra]==null?'':l[cBarra]).replace(/\D/g,'');
    const barra=barraTxt?parseInt(barraTxt,10):null;
    let tipo;
    if(/^perf/.test(tipoTxt)) tipo='perfil';
    else if(/^(comp|aces|ferr|outro)/.test(tipoTxt)) tipo='componente';
    else tipo=(unTxt==='BARRA'||unTxt==='BR'||unTxt==='BARRAS'||(barra&&barra>=1000))?'perfil':'componente';
    if(tipo==='perfil'){
      res.perfis.push({codigo:codigo, descricao:descricao, barraMm:(barra&&barra>=500&&barra<=12000)?barra:6000, cores:[]});
    } else {
      const un=UNIDADE_DA_PLANILHA[unTxt]||(/^[A-Z]{1,4}$/.test(unTxt)?unTxt:'PC');
      res.componentes.push({codigo:codigo, descricao:descricao, unidade:un});
    }
  }
  return res;
}

// O que a importacao faria, comparando com o cadastro de AGORA (base = banco
// na hora de gravar, ou a tela na previa).
function planoDeImportacao(lido, base){
  const plano={novos:[], completar:[], iguais:0};
  lido.perfis.map(function(p){ return Object.assign({tipo:'perfil'},p); })
    .concat(lido.componentes.map(function(c){ return Object.assign({tipo:'componente'},c); }))
    .forEach(function(x){
      const m=materialPorCodigo(x.codigo, base);
      if(!m){ plano.novos.push(x); return; }
      if(m.tipo!==x.tipo){ plano.iguais++; return; }   // mesmo codigo com outro tipo: nao mexe
      if(!m.descricao && x.descricao){ plano.completar.push({m:m, x:x}); return; }
      plano.iguais++;
    });
  return plano;
}

  if(L.ignoradas&&L.ignoradas.length) h+='<div class="aviso-linha aviso-ambar"><b>'+L.ignoradas.length+' linha(s) da planilha ficaram de fora:</b><br>'+

  if(!plano.novos.length && !plano.completar.length){
    caixa.innerHTML=h+'<div class="vazio">Nada novo: tudo deste PDF já está no estoque.</div>'; return;

async function gravarImportacao(){

  const deu=await alterar(function(base){
    // Refeito em cima do banco: um colega pode ter cadastrado algum no meio.
    const plano=planoDeImportacao(L, base);
    feitos=0; completados=0;
    const quando=agoraISO();
    plano.novos.forEach(function(x){
      const n={id:novoId(),tipo:x.tipo,codigo:x.codigo,descricao:x.descricao||'',minimos:{},criadoPor:usuario,criadoEm:quando,
        origem:{arquivo:arq,proposta:L.proposta||''}};
      if(x.tipo==='perfil') n.barraMm=x.barraMm||6000; else n.unidade=x.unidade||'PC';
      base.materiais.push(n); feitos++;
    });
    plano.completar.forEach(function(c){
      const b=base.materiais.find(function(m){ return m.id===c.m.id; });
      if(b && !b.descricao){ b.descricao=c.x.descricao; b.editadoPor=usuario; b.editadoEm=quando; completados++; }
    });
    if(!feitos && !completados) return 'Nada novo: tudo deste PDF já está no estoque.';
  },function(){ return {acao:/\.pdf$/i.test(arq)?'importou cadastro do PDF':'importou cadastro da planilha',alvo:arq,detalhe:feitos+' novo(s)'+(completados?', '+completados+' com descrição':'')+(L.proposta?' · '+L.proposta:'')}; });
  if(btn) btn.disabled=false;
  if(deu){ fecharJanela(); aviso('Cadastro importado',feitos+' material(is) cadastrado(s)'+(completados?' e '+completados+' ganharam a descrição':'')+'.\n\nO saldo de todos começa em zero: lance as entradas conforme o material chegar.'); }
}

// ================= ABA: FIGURAS DOS PERFIS =================
let _figs={busca:'',fam:'',pagina:0,cadastrados:false};
const FIGS_POR_PAGINA=48;
function familia(cod){ const m=String(cod).toUpperCase().match(/^[A-Z]+/); return m?m[0]:'NÚMEROS'; }
async function desenharFiguras(){
  const corpo=document.getElementById('figuras-corpo'); if(!corpo) return;
  let lista;
  try{ lista=await carregarListaPerfis(); }
  catch(e){ corpo.innerHTML='<div class="vazio">Não consegui abrir a lista de figuras: '+esc(e.message)+'</div>'; return; }
  if(!document.getElementById('figuras-corpo')) return;
  const cadastrados={}; dados.materiais.forEach(function(m){ if(!m.inativo) cadastrados[normCodigo(m.codigo)]=m.id; });
  const contagem={}; lista.forEach(function(c){ const f=familia(c.codigo); contagem[f]=(contagem[f]||0)+1; });
  const fams=Object.keys(contagem).sort(function(a,b){ return contagem[b]-contagem[a] || a.localeCompare(b); });
  const q=semAcento(_figs.busca).toUpperCase().replace(/[^A-Z0-9]+/g,'');
  const filtrados=lista.filter(function(c){
    if(_figs.fam && familia(c.codigo)!==_figs.fam) return false;
    if(_figs.cadastrados && !cadastrados[c.codigo]) return false;
    if(q && c.codigo.replace(/[^A-Z0-9]+/g,'').indexOf(q)<0) return false;
    return true;
  });
  // Quem digita "LG0" quer os LG0... antes dos KAW-LG0...: igual primeiro,
  // depois os que comecam com o que foi digitado, depois o resto.
  if(q){
    const peso=function(c){ const k=c.codigo.replace(/[^A-Z0-9]+/g,''); return k===q?0:(k.indexOf(q)===0?1:2); };
    filtrados.sort(function(a,b){ return peso(a)-peso(b) || a.codigo.localeCompare(b.codigo); });
  }
  const paginas=Math.max(1,Math.ceil(filtrados.length/FIGS_POR_PAGINA));
  if(_figs.pagina>=paginas) _figs.pagina=paginas-1;
  const pag=filtrados.slice(_figs.pagina*FIGS_POR_PAGINA,(_figs.pagina+1)*FIGS_POR_PAGINA);
  let h='<div class="barra"><input class="busca" id="figs-busca" placeholder="Buscar pelo código (ex.: LG068, FA-200, SU)" value="'+esc(_figs.busca)+'" '+
      'oninput="_figs.busca=this.value;_figs.pagina=0;clearTimeout(window._tF);window._tF=setTimeout(desenharFiguras,300)">'+
    '<select class="busca" style="flex:0 0 auto;width:auto" onchange="_figs.fam=this.value;_figs.pagina=0;desenharFiguras()">'+
      '<option value="">Todas as famílias ('+lista.length+')</option>'+fams.map(function(f){ return '<option value="'+esc(f)+'"'+(f===_figs.fam?' selected':'')+'>'+esc(f)+' ('+contagem[f]+')</option>'; }).join('')+'</select>'+
    (soAdmin()&&!ehEspelho()?'<button class="btn btn-outline" onclick="abrirCargaPerfis()">☁ Subir figuras para a nuvem</button>':'')+'</div>'+
    '<div class="filtros"><label><input type="checkbox"'+(_figs.cadastrados?' checked':'')+' onchange="_figs.cadastrados=this.checked;_figs.pagina=0;desenharFiguras()"> Só os já cadastrados no estoque</label>'+
    '<span style="color:var(--gray-5)">'+filtrados.length+' figura(s)'+(paginas>1?' · página '+(_figs.pagina+1)+' de '+paginas:'')+'</span></div>';
  h+='<div class="figs-grade">'+pag.map(function(c){
    const mid=cadastrados[c.codigo];
    return '<button class="fig-cel" onclick="'+(mid?'abrirDetalhe(\''+mid+'\')':'cadastrarDaFigura('+jsArg(c.codigo)+')')+'" title="'+esc(c.codigo)+'">'+
      '<img data-fig="'+esc(c.id)+'" alt=""><span>'+esc(c.codigo)+'</span>'+(mid?'<small>✓ no estoque</small>':'')+'</button>';
  }).join('')+'</div>';
  if(!pag.length) h+='<div class="vazio">Nenhuma figura com esse código.</div>';
  if(paginas>1) h+='<div class="paginas">'+
    '<button class="btn btn-outline btn-sm"'+(_figs.pagina?'':' disabled')+' onclick="_figs.pagina--;desenharFiguras()">← anteriores</button>'+
    '<button class="btn btn-outline btn-sm"'+(_figs.pagina<paginas-1?'':' disabled')+' onclick="_figs.pagina++;desenharFiguras()">próximas →</button></div>';
  const foco=document.activeElement&&document.activeElement.id==='figs-busca';
  corpo.innerHTML=h;
  if(foco){ const b=document.getElementById('figs-busca'); b.focus(); b.setSelectionRange(b.value.length,b.value.length); }
  try{
    const links=await linksDeFiguras(pag.map(function(c){ return c.id; }));
    pag.forEach(function(c,i){
      const im=corpo.querySelector('img[data-fig="'+c.id+'"]'); if(!im) return;
      im.onerror=function(){ im.replaceWith(Object.assign(document.createElement('div'),{className:'falta',textContent:'ainda não carregada'})); };
      im.src=links[i];
    });
  }catch(err){ corpo.insertAdjacentHTML('afterbegin','<div class="aviso-linha aviso-verm">Não consegui mostrar as figuras: '+esc(err.message)+'</div>'); }
}
async function cadastrarDaFigura(cod){
  if(ehConsulta()||ehEspelho()){ aviso('Só consulta','Este perfil ainda não está cadastrado no estoque.'); return; }
  if(!await perguntar('Cadastrar '+cod,'O perfil '+cod+' ainda não está no estoque.\n\nCadastrar agora?','Cadastrar')) return;
  abrirMaterial(null, cod);
}

// ---- Subir a biblioteca para a nuvem (so admin, uma vez) ----
// A pessoa escolhe a PASTA C:\Daluminium\figuras-perfis (figuras ja
// reduzidas, nome = codigo limpo). O Worker assina com overwrite=false: subir
// de novo o que ja esta la nao estraga nada, e o navegador lembra o que ja foi
// (localStorage), para recomecar de onde parou.
const LS_PERFIS_SUBIDOS='dalum-perfis-subidos';
let _carga=null;
function perfisJaSubidos(){ try{ return new Set(JSON.parse(localStorage.getItem(LS_PERFIS_SUBIDOS)||'[]')); }catch(e){ return new Set(); } }
function guardarSubidos(s){ try{ localStorage.setItem(LS_PERFIS_SUBIDOS,JSON.stringify(Array.from(s))); }catch(e){} }
async function abrirCargaPerfis(){
  if(!soAdmin()){ aviso('Só o administrador','Só o administrador carrega a biblioteca de figuras.'); return; }
  let lista; try{ lista=await carregarListaPerfis(); }catch(e){ aviso('Lista de figuras',e.message); return; }
  const subidos=perfisJaSubidos();
  const ja=lista.filter(function(c){ return subidos.has(c.id); }).length;
  _janelaAtual=null;
  abrirJanela('Figuras na nuvem','<div style="font-size:13.5px;line-height:1.6">'+
    'A lista tem <b>'+lista.length+'</b> figuras. Por este computador já subiram <b>'+ja+'</b>.<br><br>'+
    '1. Clique em <b>Escolher a pasta</b> e selecione a pasta <b>C:\\Daluminium\\figuras-perfis</b>.<br>'+
    '2. O navegador pergunta se pode enviar os arquivos: confirme.<br>'+
    '3. Deixe esta tela aberta até terminar (uns 30 a 40 minutos). Se parar, é só fazer de novo: continua de onde parou.</div>'+
    '<div style="margin-top:12px"><label class="btn btn-cor">📁 Escolher a pasta<input type="file" webkitdirectory multiple hidden onchange="iniciarCargaPerfis(this)"></label></div>'+
    '<div id="carga-status" style="margin-top:12px"></div>', '', 560);
  if(_carga && !_carga.fim) mostrarCarga();
}
function mostrarCarga(){
  const st=document.getElementById('carga-status'); if(!st||!_carga) return;
  const pct=_carga.total?Math.round(_carga.feitos*100/_carga.total):100;
  st.innerHTML='<div style="background:var(--gray-2);border-radius:6px;height:12px;overflow:hidden"><div style="background:var(--cor);height:12px;width:'+pct+'%"></div></div>'+
    '<div style="font-size:13px;margin-top:6px">'+_carga.feitos+' de '+_carga.total+' enviadas ('+pct+'%)'+(_carga.erros.length?' · <span style="color:var(--red)">'+_carga.erros.length+' com erro</span>':'')+
    (_carga.fora?' · '+_carga.fora+' arquivo(s) fora da lista (ignorados)':'')+'</div>'+
    (_carga.parar||_carga.fim?'':'<button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="_carga.parar=true">Pausar</button>')+
    (_carga.fim?'<div class="aviso-linha '+(_carga.parar?'aviso-ambar':'aviso-azul')+'" style="margin-top:8px">'+(_carga.parar?'Pausado. Para continuar, escolha a pasta de novo.':
      'Terminado. '+_carga.feitos+' figura(s) enviada(s)'+(_carga.erros.length?'; '+_carga.erros.length+' com erro — escolha a pasta de novo para tentar só essas.':'.'))+'</div>':'');
}
async function iniciarCargaPerfis(input){
  const arquivos=Array.prototype.slice.call(input.files||[]); input.value='';
  const lista=await carregarListaPerfis();
  const porId={}; lista.forEach(function(c){ porId[c.id.toUpperCase()]=c; });
  const subidos=perfisJaSubidos();
  const fila=[]; let fora=0, achados=0;
  arquivos.forEach(function(f){
    if(!/\.png$/i.test(f.name)) return;
    const c=porId[f.name.replace(/\.png$/i,'').toUpperCase()];
    if(!c){ fora++; return; }
    achados++;
    if(!subidos.has(c.id)) fila.push({f:f,c:c});
  });
  const st=document.getElementById('carga-status');
  if(!achados){
    if(st) st.innerHTML='<div class="aviso-linha aviso-ambar">Não achei figuras nesta pasta ('+arquivos.length+' arquivo(s)). Escolha a pasta <b>figuras-perfis</b>.</div>';
    return;
  }
  if(!fila.length){ if(st) st.innerHTML='<div class="aviso-linha aviso-azul">Nada a enviar: todas as '+achados+' figuras desta pasta já estão na nuvem.</div>'; return; }
  _carga={total:fila.length, feitos:0, erros:[], parar:false, fim:false, fora:fora};
  mostrarCarga();
  let i=0;
  const trabalhador=async function(){
    while(i<fila.length && !_carga.parar){
      const it=fila[i++];
      try{
        const r=await fetch(WORKER,{method:'POST',cache:'no-store',
          headers:cabecalhos({'Content-Type':'application/json','X-Action':'assinar-envio'}),
          body:JSON.stringify({pasta:PASTA_PERFIS, publicId:it.c.id})});
        let a=null; try{ a=await r.json(); }catch(e){}
        if(r.status===401){ sessaoExpirada(); _carga.parar=true; return; }
        if(!r.ok||!a||!a.signature) throw new Error((a&&a.erro)||('assinatura '+r.status));
        const fd=new FormData();
        fd.append('file',it.f); fd.append('api_key',a.api_key); fd.append('timestamp',a.timestamp);
        fd.append('signature',a.signature); fd.append('public_id',a.public_id); fd.append('overwrite',a.overwrite); fd.append('type',a.type);
        const up=await fetch('https://api.cloudinary.com/v1_1/'+a.conta+'/image/upload',{method:'POST',body:fd});
        if(!up.ok){
          let t=''; try{ t=await up.text(); }catch(e){}
          // overwrite=false: a figura ja estava la (outro computador subiu). Conta como feita.
          if(!/already exists/i.test(t)) throw new Error('nuvem '+up.status+' '+t.slice(0,80));
        }
        subidos.add(it.c.id);
        _carga.feitos++;
        if(_carga.feitos%50===0) guardarSubidos(subidos);
      }catch(err){ _carga.erros.push(it.c.codigo+': '+err.message); }
      mostrarCarga();
    }
  };
  await Promise.all([trabalhador(),trabalhador(),trabalhador(),trabalhador(),trabalhador(),trabalhador()]);
  guardarSubidos(subidos);
  _carga.fim=true;
  mostrarCarga();
  if(_carga.erros.length) console.warn('Figuras com erro:',_carga.erros);
}

window.addEventListener('beforeunload',function(ev){
  if(_carga && !_carga.parar && !_carga.fim){ ev.preventDefault(); ev.returnValue=''; }
});

// ================= ABERTURA =================
function abrirApp(nome,papelDoUsuario){
  usuario=nome;
  papel=String(papelDoUsuario||'').toLowerCase();
  const t=lerToken(); login=(t&&t.dados&&t.dados.u)?String(t.dados.u).toLowerCase():'';
  acaoSessao('sessao-entrar',{sistema:'estoque'}).catch(function(){});
  if(!_checkSessao) _checkSessao=setInterval(checkForceLogout,5000);
  document.getElementById('bloqueio').style.display='none';
  document.getElementById('app').style.display='block';
  try{ const a=sessionStorage.getItem('dalum-estoque-aba'); if(a) aba=a; }catch(e){}
  lerLocal();
  carregarListaPerfis().then(function(){ if(aba!=='figuras') preencherFiguras(document.getElementById('tela')); }).catch(function(){});
  render();
  sincronizar();
  document.getElementById('aviso-ov').addEventListener('click',function(e){ if(e.target===this) fecharAviso(); });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(document.getElementById('aviso-ov').classList.contains('open')) fecharAviso();
    else if(document.getElementById('pergunta-ov').classList.contains('open')) responderPergunta(false);
    else if(document.getElementById('janela-ov').classList.contains('open')) fecharJanela();
  });
  // Busca lancamentos de colegas a cada 60 s (sem redesenhar por baixo de
  // quem esta digitando numa janela).
  setInterval(function(){ atualizarDoBanco(); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) atualizarDoBanco(); });
}

(function iniciar(){
  const t=lerToken();
  if(t){ abrirApp(t.dados.n||t.dados.u||'usuário', t.dados.r); return; }
  const sso=lerSSO();
  if(sso){ abrirApp(sso.nome, sso.role); return; }
  // Sem cracha: vai para o portal, o unico lugar onde se entra.
  try{ (window.top||window).location.replace(PORTAL_URL); }
  catch(e){ window.location.replace(PORTAL_URL); }
})();
